<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧神诺CRM · Skills编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        .skill-item { transition: background 0.15s, border-color 0.15s; }
        .skill-item.active { background: rgb(30 41 59); border-color: rgb(99 102 241); }
        .tab-btn { transition: all 0.15s; }
        .tab-btn.active { background: rgb(30 58 138); color: white; border-color: rgb(59 130 246); }
        .cap-card:hover { box-shadow: 0 0 0 1px rgb(99 102 241 / 0.4); }
        .cap-card.expanded { box-shadow: 0 0 0 2px rgb(99 102 241 / 0.6); }
        input, textarea, select {
            background: rgb(15 23 42); border: 1px solid rgb(51 65 85);
            color: rgb(226 232 240); border-radius: 6px; padding: 6px 10px;
            width: 100%; font-size: 13px; outline: none; transition: border-color 0.15s;
        }
        input:focus, textarea:focus, select:focus { border-color: rgb(99 102 241); }
        textarea { resize: vertical; font-family: ui-sans-serif, system-ui; line-height: 1.6; }
        .field-label { font-size: 11px; font-weight: 600; color: rgb(148 163 184); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .section-title { font-size: 13px; font-weight: 700; color: rgb(199 210 254); border-left: 3px solid rgb(99 102 241); padding-left: 8px; margin-bottom: 12px; }
        .report-section { background: rgb(15 23 42); border: 1px solid rgb(30 41 59); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .color-swatch.selected { transform: scale(1.3); box-shadow: 0 0 0 2px white; }
        .emoji-btn { font-size: 18px; cursor: pointer; padding: 3px 5px; border-radius: 5px; transition: background 0.1s; }
        .emoji-btn:hover { background: rgb(51 65 85); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgb(51 65 85); border-radius: 3px; }
        .preview-chat { font-size: 12px; line-height: 1.6; }
        .process-row { display: grid; grid-template-columns: 1fr 1fr 2fr 1fr; gap: 6px; align-items: start; margin-bottom: 6px; }
        .list-item-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 6px; align-items: start; margin-bottom: 6px; }
        .pain-card { background: rgb(30 41 59); border: 1px solid rgb(51 65 85); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .add-row-btn { width: 100%; padding: 6px; border: 1px dashed rgb(51 65 85); border-radius: 6px; font-size: 12px; color: rgb(100 116 139); background: transparent; cursor: pointer; transition: all 0.15s; text-align: center; }
        .add-row-btn:hover { border-color: rgb(99 102 241); color: rgb(165 180 252); }
        .del-btn { background: transparent; border: none; color: rgb(148 163 184); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
        .del-btn:hover { color: rgb(248 113 113); background: rgb(30 41 59); }
        /* Format guide styles */
        .fmt-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .fmt-short  { background: rgb(30 58 138 / 0.5); color: rgb(147 197 253); }
        .fmt-list   { background: rgb(20 83 45 / 0.5); color: rgb(134 239 172); }
        .fmt-tpl    { background: rgb(88 28 135 / 0.5); color: rgb(216 180 254); }
        .fmt-num    { background: rgb(120 53 15 / 0.5); color: rgb(253 186 116); }
        .fmt-guide  { font-size: 11px; color: rgb(100 116 139); line-height: 1.6; margin: 4px 0 6px; padding: 8px 10px; background: rgb(15 23 42); border-left: 2px solid rgb(51 65 85); border-radius: 0 6px 6px 0; }
        .fmt-guide strong { color: rgb(148 163 184); }
        .fmt-guide code { background: rgb(30 41 59); padding: 1px 5px; border-radius: 3px; font-size: 10px; color: rgb(165 180 252); font-family: ui-monospace, monospace; }
        .tpl-btn { font-size: 10px; padding: 2px 8px; background: rgb(30 41 59); border: 1px solid rgb(51 65 85); border-radius: 4px; color: rgb(148 163 184); cursor: pointer; transition: all 0.1s; white-space: nowrap; }
        .tpl-btn:hover { border-color: rgb(99 102 241); color: rgb(165 180 252); }
        .field-row { margin-bottom: 14px; }
        .field-header { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .required { color: rgb(248 113 113); font-size: 10px; margin-left: 2px; }
        .pain-card { background: rgb(30 41 59); border: 1px solid rgb(51 65 85); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
        .pain-card .sub-label { font-size: 10px; font-weight: 600; color: rgb(100 116 139); text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 3px; }
        .pain-card .sub-hint { font-size: 11px; color: rgb(71 85 105); margin-bottom: 4px; }
        /* Permissions tab */
        .risk-badge { display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:0.03em; }
        .risk-low { background:rgb(20 83 45 / 0.4);color:rgb(134 239 172);border:1px solid rgb(20 83 45); }
        .risk-mid { background:rgb(120 53 15 / 0.4);color:rgb(253 186 116);border:1px solid rgb(120 53 15); }
        .risk-high { background:rgb(127 29 29 / 0.4);color:rgb(252 165 165);border:1px solid rgb(127 29 29); }
        .perm-check { display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;border:2px solid rgb(51 65 85);cursor:pointer;transition:all 0.15s;flex-shrink:0; }
        .perm-check.on { background:rgb(30 58 138);border-color:rgb(99 102 241);color:rgb(165 180 252); }
        .compliance-item { display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:12px; }
        .compliance-pass { background:rgb(20 83 45 / 0.15);border:1px solid rgb(20 83 45 / 0.4); }
        .compliance-fail { background:rgb(127 29 29 / 0.15);border:1px solid rgb(127 29 29 / 0.4); }
        .compliance-unknown { background:rgb(30 41 59);border:1px solid rgb(51 65 85); }
        .audit-row { display:grid;grid-template-columns:130px 80px 150px 1fr 70px 1fr;gap:6px;padding:8px 10px;font-size:11px;border-bottom:1px solid rgb(30 41 59);align-items:center; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

<nav class="bg-slate-900 border-b border-slate-800 px-5 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">

            <button id="btn-tech-view" onclick="setViewMode('tech')" style="padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:transparent;color:rgb(100 116 139)">🔧 技术视图</button>
        </div>
        <div id="tech-only-btns" class="flex items-center space-x-2" style="display:none!important">
            <button onclick="newSkill()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 rounded text-xs font-medium">+ 新增Skill</button>
            <button onclick="exportDoc()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded text-xs font-medium">📄 导出调研报告</button>
            <button onclick="exportSkillMd()" class="px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 rounded text-xs font-medium">📐 导出SKILL.md</button>
            <button onclick="exportJSON()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium">📥 导出JSON</button>
            <button onclick="importJSON()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium">📤 导入JSON</button>
        </div>
        <div id="biz-only-btns" class="flex items-center space-x-2">
            <button onclick="newSkill()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 rounded text-xs font-medium">+ 新增Skill</button>
        </div>
    </div>
</nav>

<div class="flex flex-1 overflow-hidden">
    <div class="w-52 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col overflow-hidden">
        <div class="px-3 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-800">Skills</div>
        <div id="skill-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </div>
    <div class="flex-1 flex flex-col overflow-hidden">
        <div id="editor-panel" class="flex-1 overflow-y-auto p-5"></div>
    </div>
    <div class="w-72 shrink-0 bg-slate-900 border-l border-slate-800 flex flex-col overflow-hidden">
        <div class="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-800 flex items-center justify-between">
            <span>预览</span>
            <div class="flex space-x-1">
                <button onclick="setPreview('card')" id="preview-tab-card" class="tab-btn px-2 py-0.5 rounded text-xs border border-transparent active">卡片</button>
                <button onclick="setPreview('chat')" id="preview-tab-chat" class="tab-btn px-2 py-0.5 rounded text-xs border border-transparent">对话</button>
                <button onclick="setPreview('report')" id="preview-tab-report" class="tab-btn px-2 py-0.5 rounded text-xs border border-transparent">报告</button>
            </div>
        </div>
        <div id="preview-panel" class="flex-1 overflow-y-auto p-4 text-xs"></div>
    </div>
</div>

        el.onmouseleave = ()=>el.querySelector('.del-btn').style.opacity='0';

    });
}

function reportCompleteness(r) {
    if (!r) return 0;
    const fields = ['department','interviewee','objective','background','systemGoal','processChain','bizClassification','coreLogic'];
    const filled = fields.filter(f => r[f] && r[f].trim()).length;
    const hasPain = r.painPoints?.some(p=>p.title);
    const hasReq = r.aiRequirements?.some(a=>a.title);
    const hasNodes = r.processNodes?.some(n=>n.step);
    return Math.round(((filled + (hasPain?1:0) + (hasReq?1:0) + (hasNodes?1:0)) / (fields.length+3)) * 100);
}

function updateBizParam(key, val) {
    const s = skills[currentKey];

function toggleBizParam(key) {
    const s = skills[currentKey];
    for (const group of (s.bizParams||[])) {

function insertTpl(field, tpl) {
    const cur = skills[currentKey].report[field] || '';
    if (cur && !confirm('当前字段已有内容，填入模板会覆盖，确认？')) return;
    skills[currentKey].report[field] = tpl.replace(/\\n/g, '\n');
    autoSave();
    renderReportTab(document.getElementById('editor-content'));
}

function renderProcessNodes() {
    const r = skills[currentKey].report;
    const el = document.getElementById('process-canvas');
    if (!el) return;
    const nodes = r.processNodes||[];
    el.innerHTML = nodes.map((n,i) => `
        <div onclick="editProcessNode(${i})" style="display:inline-block;background:rgb(30 41 59);border:2px solid rgb(99 102 241);border-radius:8px;padding:8px 12px;margin:0 8px 8px 0;cursor:pointer;position:relative;transition:all 0.15s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
            <div style="font-size:13px;font-weight:600;color:rgb(165 180 252);margin-bottom:2px">${n.step||'节点'+(i+1)}</div>
            <div style="font-size:10px;color:rgb(100 116 139)">${n.action||'点击编辑'}</div>
            ${i<nodes.length-1?'<span style="position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:rgb(99 102 241);font-size:16px">→</span>':''}
        </div>`).join('');
}
let editingNode = null;
function editProcessNode(i) {
    const n = skills[currentKey].report.processNodes[i];
    editingNode = i;
    const modal = `<div id="node-modal" onclick="if(event.target.id==='node-modal')closeNodeModal()" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999">
        <div onclick="event.stopPropagation()" style="background:rgb(15 23 42);border:2px solid rgb(99 102 241);border-radius:12px;padding:20px;width:500px;max-width:90%">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <span style="font-size:16px;font-weight:700;color:rgb(199 210 254)">编辑节点 ${i+1}</span>
                <button onclick="removeListItem('processNodes',${i});closeNodeModal()" style="background:rgb(127 29 29);color:white;padding:4px 10px;border-radius:6px;font-size:11px;border:none;cursor:pointer">删除节点</button>
            </div>
            <div style="margin-bottom:12px"><label style="font-size:11px;color:rgb(148 163 184);display:block;margin-bottom:4px">环节名称</label><input id="node-step" value="${esc(n.step)}" placeholder="如：拜访签到" style="width:100%;background:rgb(30 41 59);border:1px solid rgb(51 65 85);color:white;padding:8px;border-radius:6px"/></div>
            <div style="margin-bottom:12px"><label style="font-size:11px;color:rgb(148 163 184);display:block;margin-bottom:4px">输入材料/数据</label><input id="node-input" value="${esc(n.input)}" placeholder="如：位置+客户地址" style="width:100%;background:rgb(30 41 59);border:1px solid rgb(51 65 85);color:white;padding:8px;border-radius:6px"/></div>
            <div style="margin-bottom:12px"><label style="font-size:11px;color:rgb(148 163 184);display:block;margin-bottom:4px">执行动作</label><textarea id="node-action" rows="2" placeholder="如：GPS自动匹配，一键确认签到" style="width:100%;background:rgb(30 41 59);border:1px solid rgb(51 65 85);color:white;padding:8px;border-radius:6px;resize:vertical">${esc(n.action)}</textarea></div>
            <div style="margin-bottom:16px"><label style="font-size:11px;color:rgb(148 163 184);display:block;margin-bottom:4px">输出产物</label><input id="node-output" value="${esc(n.output)}" placeholder="如：签到记录" style="width:100%;background:rgb(30 41 59);border:1px solid rgb(51 65 85);color:white;padding:8px;border-radius:6px"/></div>
            <button onclick="saveNodeEdit()" style="width:100%;background:rgb(99 102 241);color:white;padding:10px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer">保存</button>
        </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend', modal);
}
function saveNodeEdit() {
    const n = skills[currentKey].report.processNodes[editingNode];
    n.step = document.getElementById('node-step').value;
    n.input = document.getElementById('node-input').value;
    n.action = document.getElementById('node-action').value;
    n.output = document.getElementById('node-output').value;
    autoSave();
    closeNodeModal();
    renderProcessNodes();
}
function closeNodeModal() {
    document.getElementById('node-modal')?.remove();
    editingNode = null;
}

function renderDataItems(key) {
    const r = skills[currentKey].report;
    const el = document.getElementById(key==='structuredData'?'structured-data-list':'unstructured-data-list');
    if (!el) return;
    const isStruct = key === 'structuredData';
    el.innerHTML = (r[key]||[]).map((d,i) => `
        <div class="list-item-row mb-1">
            <input value="${d.name||''}" placeholder="${isStruct ? '如：经销商档案（BIP）' : '如：促销政策文件（Word）'}" oninput="updateReportList('${key}',${i},'name',this.value)"/>
            <input value="${d.desc||''}" placeholder="${isStruct ? '含哪些字段，通过什么方式获取，有什么局限...' : '包含什么复杂规则，为何无法直接结构化...'}" oninput="updateReportList('${key}',${i},'desc',this.value)"/>
            <button onclick="removeListItem('${key}',${i})" class="del-btn">✕</button>
        </div>`).join('');
}

                <button onclick="removeListItem('painPoints',${i})" class="del-btn text-xs">✕</button>

            <div class="field-row" style="margin-bottom:10px">

                <input value="${p.impact||''}" placeholder="如：12名业务员每年浪费约4320小时，拜访补录率40%导致商机跟进漏洞率约25%" oninput="updateReportList('painPoints',${i},'impact',this.value)" style="border-color:rgb(127 29 29 / 0.5)"/>
            </div>
        </div>`).join('');

function renderAIReqs() {
    const r = skills[currentKey].report;
    const el = document.getElementById('ai-req-list');
    if (!el) return;
    const painCount = (r.painPoints||[]).filter(p=>p.title).length;

// ─── Preview ──────────────────────────────────────────────────────────────────
function setPreview(mode) {
    previewMode = mode;
    ['card','chat','report'].forEach(m => document.getElementById('preview-tab-'+m).classList.toggle('active', m===mode));
    renderPreview();
}

function renderPreview() {
    if (!currentKey) return;
    const panel = document.getElementById('preview-panel');
    if (previewMode==='card') renderCardPreview(panel);
    else if (previewMode==='chat') renderChatPreview(panel);
    else renderReportPreview(panel);
}

function renderCardPreview(panel) {
    const s = skills[currentKey];
    const c = COLORS[s.color]||COLORS.blue;
    panel.innerHTML = `
        <div class="fade-in">
            <div class="rounded-xl p-4 mb-3 border-2" style="background:${c.bg};border-color:${c.border}">
                <div class="flex items-center space-x-2 mb-2">
                    <span class="text-2xl">${s.icon}</span>
                    <div><div class="font-bold text-xs">${s.name}</div><div class="text-xs" style="color:${c.text}">${s.command}</div></div>
                </div>
                <p class="text-xs text-slate-300 mb-2">${s.description}</p>
                <div class="space-y-1">
                    ${s.capabilities.map(cap=>`
                        <div class="flex items-center space-x-1 text-xs">
                            <span>${cap.icon}</span><span>${cap.name}</span>
                            ${cap.demoQuery?'<span class="text-green-400">•</span>':''}
                            ${cap.alertTitle?'<span class="text-red-400">⚠</span>':''}
                        </div>`).join('')}
                </div>
            </div>
            ${s.capabilities.filter(c=>c.alertTitle).map(cap=>{
                const clr=cap.alertLevel==='高'?'#ef4444':cap.alertLevel==='中'?'#f59e0b':'#64748b';
                return `<div class="rounded-lg p-2 mb-2 border text-xs" style="border-color:${clr};background:${clr}18">
                    <div class="flex items-center space-x-1 mb-1"><span style="color:${clr}">⚠ ${cap.alertLevel}</span><span class="font-medium">${cap.alertTitle}</span></div>
                    <div class="text-slate-300 whitespace-pre-line">${cap.alertContent}</div>
                </div>`;
            }).join('')}
        </div>`;
}

function renderChatPreview(panel, capIdx) {
    const s = skills[currentKey];
    const demos = s.capabilities.filter(c=>c.demoQuery);
    if (!demos.length) { panel.innerHTML=`<div class="text-xs text-slate-500 text-center mt-10">暂无Demo对话</div>`; return; }
    const cap = capIdx!==undefined ? s.capabilities[capIdx] : demos[0];
    panel.innerHTML = `
        <div class="fade-in">
            <div class="flex flex-wrap gap-1 mb-3">
                ${demos.map(c=>{
                    const idx=s.capabilities.indexOf(c);

                        class="px-2 py-0.5 rounded text-xs border transition-colors ${c===cap?'bg-indigo-700 border-indigo-600':'bg-slate-800 border-slate-700 hover:border-indigo-600'}"
                    >${c.icon} ${c.name}</button>`;

            </div>
            <div class="preview-chat space-y-3">
                <div class="flex justify-end"><div class="bg-indigo-600 text-white rounded-xl rounded-tr-sm px-3 py-2 text-xs max-w-full">${cap.demoQuery}</div></div>

}

function renderReportPreview(panel) {

    const c = COLORS[s.color]||COLORS.blue;
    panel.innerHTML = `

function previewCap(i) { setPreview('chat'); renderChatPreview(document.getElementById('preview-panel'),i); }

// ─── Mutations ────────────────────────────────────────────────────────────────
function update(field, val) {
    skills[currentKey][field] = val;
    autoSave();
    if(['icon','color','name'].includes(field)) { renderSidebar(); renderEditor(); setTab(currentTab); }
    renderPreview();
}
function updateCap(i,f,v) { skills[currentKey].capabilities[i][f]=v; autoSave(); renderPreview(); }
function toggleCap(i) { expandedCap = expandedCap===i?null:i; renderCapsList(); }
function addCap() { skills[currentKey].capabilities.push({name:'新能力',icon:'✨',desc:'描述...'}); expandedCap=skills[currentKey].capabilities.length-1; autoSave(); renderCapsTab(document.getElementById('editor-content')); renderPreview(); }
function deleteCap(i) { skills[currentKey].capabilities.splice(i,1); if(expandedCap===i)expandedCap=null; else if(expandedCap>i)expandedCap--; autoSave(); renderCapsTab(document.getElementById('editor-content')); renderPreview(); }
function moveCap(i,d) { const c=skills[currentKey].capabilities; [c[i],c[i+d]]=[c[i+d],c[i]]; if(expandedCap===i)expandedCap=i+d; else if(expandedCap===i+d)expandedCap=i; autoSave(); renderCapsList(); renderPreview(); }

function updateReport(field, val) {
    if(!skills[currentKey].report) skills[currentKey].report=emptyReport();
    skills[currentKey].report[field]=val;
    autoSave();
    if(previewMode==='report') renderPreview();
    renderSidebar();
}
function updateReportList(listKey, i, field, val) {
    if (!skills[currentKey].report?.[listKey]?.[i]) return;
    skills[currentKey].report[listKey][i][field]=val;
    autoSave();
}
function removeListItem(listKey, i) {
    skills[currentKey].report[listKey].splice(i,1);
    autoSave();
    renderReportTab(document.getElementById('editor-content'));
}
function addProcessNode() { skills[currentKey].report.processNodes.push({step:'',input:'',action:'',output:''}); autoSave(); renderProcessNodes(); }
function addDataItem(key) { skills[currentKey].report[key].push({name:'',desc:''}); autoSave(); renderDataItems(key); }
function addPainPoint() { skills[currentKey].report.painPoints.push({title:'',desc:'',impact:''}); autoSave(); renderPainPoints(); }
function addAIReq() { skills[currentKey].report.aiRequirements.push({title:'',desc:''}); autoSave(); renderAIReqs(); }

function newSkill() {
    const key='skill_'+Date.now();
    skills[key]={name:'新Skill',icon:'🆕',color:'indigo',command:'/new-skill',description:'...',capabilities:[],report:emptyReport()};
    currentTab='basic'; selectSkill(key);
}
function deleteSkill(key) {
    if(!confirm(`确定删除「${skills[key].name}」？`)) return;
    delete skills[key];
    currentKey=Object.keys(skills)[0]||null;
    renderSidebar();
    if(currentKey) renderEditor(); else document.getElementById('editor-panel').innerHTML='';
    autoSave();
}

function updateSkillDef(field, val) {
    if (!skills[currentKey].skillDef) skills[currentKey].skillDef = emptySkillDef();
    skills[currentKey].skillDef[field] = val;
    autoSave();
    if (field==='layerReason'||field==='invocationB'||field==='invocationC'||field==='hitl'||field==='kpiAccuracy'||field==='kpiCoverage'||field==='kpiLatency') return;
    renderSkillDefTab(document.getElementById('editor-content'));
}
function updateSkillDefList(listKey, i, val) {
    if (!skills[currentKey].skillDef) skills[currentKey].skillDef = emptySkillDef();
    skills[currentKey].skillDef[listKey][i] = val;
    autoSave();
}
function addProhibit() {
    if (!skills[currentKey].skillDef) skills[currentKey].skillDef = emptySkillDef();
    skills[currentKey].skillDef.prohibit.push('');
    autoSave();
    renderSkillDefTab(document.getElementById('editor-content'));
}
function removeProhibit(i) {
    skills[currentKey].skillDef.prohibit.splice(i,1);
    autoSave();
    renderSkillDefTab(document.getElementById('editor-content'));
}
function updateSopStep(i, field, val) {
    if (!skills[currentKey].skillDef) skills[currentKey].skillDef = emptySkillDef();
    const steps = skills[currentKey].skillDef.sopSteps;
    if (!steps[i]) return;
    steps[i][field] = val;
    autoSave();
    if (field==='type') renderSopSteps();
}
function addSopStep() {
    if (!skills[currentKey].skillDef) skills[currentKey].skillDef = emptySkillDef();
    const n = (skills[currentKey].skillDef.sopSteps||[]).length + 1;
    skills[currentKey].skillDef.sopSteps.push({step:String(n),type:'识别',logic:'',dep:''});
    autoSave();
    renderSopSteps();
}
function removeSopStep(i) {
    skills[currentKey].skillDef.sopSteps.splice(i,1);
    autoSave();
    renderSopSteps();
}

// ─── Permissions Tab ──────────────────────────────────────────────────────────
function extractRoles(skillKey) {
    const d = skills[skillKey]?.skillDef;
    if (!d?.ontoRoles) return [];
    return d.ontoRoles.split(/[、,，]+/).map(r=>r.trim()).filter(Boolean);
}

function extractCliOpNames(skillKey) {
    const d = skills[skillKey]?.skillDef;
    if (!d) return [];
    const names = new Set();
    (d.sopSteps||[]).forEach(st => {
        if (!st.dep) return;
        st.dep.split('/').map(p=>p.trim()).forEach(p => {
            if (p.toUpperCase().startsWith('CLI:')) {
                const name = p.replace(/^CLI:\s*/i,'').replace(/\s*HITL$/i,'').trim();
                if (name) names.add(name);
            }
        });
    });
    const matches = (d.invocationC||'').match(/[A-Za-z][A-Za-z0-9]*\.[A-Za-z][A-Za-z0-9.]*/g) || [];
    matches.forEach(m => names.add(m));
    return [...names];
}

function ensurePermissionsPopulated(skillKey) {
    const s = skills[skillKey];
    if (!s.skillDef) s.skillDef = emptySkillDef();
    if (!s.skillDef.permissions) s.skillDef.permissions = emptyPermissions();
    const p = s.skillDef.permissions;
    if (!p.hitlNodes) p.hitlNodes = [];
    if (!p.auditLog) p.auditLog = [];
    if (!p.roleMatrix) p.roleMatrix = [];
    if (!p.cliOps) p.cliOps = [];
    // Only auto-seed once (if never been touched by user)
    if (!p._seeded) {
        if (p.roleMatrix.length === 0) {
            const roles = extractRoles(skillKey);
            if (roles.length > 0) p.roleMatrix = roles.map(role=>({role,read:true,write:false,execute:false,approve:false}));
        }
        if (p.cliOps.length === 0) {
            const names = extractCliOpNames(skillKey);
            if (names.length > 0) p.cliOps = names.map(name=>({name,riskLevel:'中风险',requiresHitl:false,approver:'',auditLevel:'标准'}));
        }
        p._seeded = true;
        autoSave();
    }
}

                        ${timeoutActions.map(a=>`<option value="${a}" ${n.timeoutAction===a?'selected':''}>${a}</option>`).join('')}
                    </select>
                </div>
            </div>
        </div>`).join('');
    el.innerHTML = `
    <div class="report-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div class="section-title" style="margin-bottom:0">③ HITL 配置器</div>
            <button class="tpl-btn" onclick="addHitlNode()">+ 添加 HITL 节点</button>
        </div>
        <div style="font-size:11px;color:rgb(71 85 105);margin-bottom:12px">配置每个人工介入点的触发条件、审批人、超时规则和超时处理方式</div>
        ${nodesHtml}
    </div>`;
}

function renderAuditLog() {
    const el = document.getElementById('perm-audit-log');
    if (!el) return;
    const p = skills[currentKey]?.skillDef?.permissions;
    if (!p) return;
    const resultOpts = ['成功','待审批','拒绝','已撤销'];
    const logHtml = p.auditLog.length === 0
        ? `<div style="color:rgb(71 85 105);font-size:12px;padding:16px;text-align:center">暂无审计记录</div>`
        : p.auditLog.map((e,i)=>`
        <div class="audit-row" style="background:rgb(15 23 42 / 0.5);border-bottom:1px solid rgb(30 41 59)">
            <input value="${esc(e.ts)}" style="font-size:10px;padding:2px 4px" oninput="updateAuditEntry(${i},'ts',this.value)"/>
            <input value="${esc(e.operator)}" placeholder="操作员" style="font-size:10px;padding:2px 4px" oninput="updateAuditEntry(${i},'operator',this.value)"/>
            <input value="${esc(e.action)}" placeholder="操作接口" style="font-size:10px;padding:2px 4px;font-family:ui-monospace,monospace;color:rgb(165 180 252)" oninput="updateAuditEntry(${i},'action',this.value)"/>
            <input value="${esc(e.target)}" placeholder="目标对象" style="font-size:10px;padding:2px 4px" oninput="updateAuditEntry(${i},'target',this.value)"/>
            <select style="font-size:10px;padding:2px 2px" onchange="updateAuditEntry(${i},'result',this.value)">
                ${resultOpts.map(r=>`<option value="${r}" ${e.result===r?'selected':''}>${r}</option>`).join('')}
            </select>
            <div style="display:flex;gap:4px;align-items:center">
                <input value="${esc(e.approvalChain)}" placeholder="审批链路" style="font-size:10px;padding:2px 4px;flex:1" oninput="updateAuditEntry(${i},'approvalChain',this.value)"/>
                <button class="del-btn" style="font-size:12px;padding:1px 4px" onclick="removeAuditEntry(${i})">✕</button>
            </div>
        </div>`).join('');
    const header = p.auditLog.length > 0 ? `
        <div class="audit-row" style="background:rgb(15 23 42);font-weight:700;color:rgb(100 116 139);border-radius:6px 6px 0 0;border-bottom:1px solid rgb(51 65 85);font-size:10px">
            <div>时间戳</div><div>操作员</div><div>操作</div><div>目标</div><div>结果</div><div>审批链</div>
        </div>` : '';
    el.innerHTML = `
    <div class="report-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div class="section-title" style="margin-bottom:0">④ 审计日志模拟 <span style="font-size:10px;font-weight:400;color:rgb(71 85 105);margin-left:4px">Type C 写操作强制记录，不可篡改</span></div>
            <button class="tpl-btn" onclick="addAuditEntry()">+ 添加记录</button>
        </div>
        <div style="font-size:11px;color:rgb(71 85 105);margin-bottom:12px">所有 CLI 写操作均需记录：时间、操作人、操作类型、目标对象、结果、审批链路</div>
        ${header}${logHtml}
    </div>`;
}

function renderComplianceCheck() {
    const el = document.getElementById('perm-compliance');
    if (!el) return;
    const s = skills[currentKey];
    const p = s?.skillDef?.permissions;
    const d = s?.skillDef;
    if (!p || !d) return;
    // Check 1: All CLI ops have approver
    let check1 = p.cliOps.length > 0 ? p.cliOps.every(op=>op.approver&&op.approver.trim()!=='') : null;
    // Check 2: All high-risk ops have HITL
    const highRiskOps = p.cliOps.filter(op=>op.riskLevel==='高风险');
    let check2 = p.cliOps.length > 0 ? (highRiskOps.length===0 ? true : highRiskOps.every(op=>op.requiresHitl)) : null;
    // Check 3: No 识别 step has CLI dep
    const check3 = !(d.sopSteps||[]).some(st=>st.type==='识别'&&(st.dep||'').toUpperCase().includes('CLI'));
    // Check 4: High-risk ops have 强制不可篡改
    let check4 = p.cliOps.length > 0 ? (highRiskOps.length===0 ? true : highRiskOps.every(op=>op.auditLevel==='强制不可篡改')) : null;
    // Check 5: If CLI execute steps exist, must have HITL node
    const hasCliExec = (d.sopSteps||[]).some(st=>st.type==='执行'&&(st.dep||'').toUpperCase().includes('CLI'));
    let check5 = hasCliExec ? p.hitlNodes.length > 0 : null;

    const checks = [
        { label:'所有 CLI 操作已配置审批人', desc:'每个写操作须明确责任边界，指定审批角色', val:check1 },
        { label:'高风险操作已开启 HITL', desc:'高风险 CLI 操作严禁自动闭环，必须配置人工审批节点', val:check2 },
        { label:'L1「识别」步骤不直接调用 CLI', desc:'反模式预防：L1 严禁直接操作业务系统，必须经 L3 编排层', val:check3 },
        { label:'高风险操作审计级别为「强制不可篡改」', desc:'Type C 写操作的审计日志须不可篡改，可追溯', val:check4 },
        { label:'CLI 执行步骤已配置 HITL 中断节点', desc:'"没有审批规则不得自动放行"前提条件', val:check5 },
    ];
    const itemClass = v => v===true?'compliance-item compliance-pass':v===false?'compliance-item compliance-fail':'compliance-item compliance-unknown';
    const icon = v => v===true?'✅':v===false?'❌':'⬜';
    const passCount = checks.filter(c=>c.val===true).length;
    const failCount = checks.filter(c=>c.val===false).length;
    const badgeBg = failCount>0 ? 'rgb(127 29 29 / 0.3)' : 'rgb(20 83 45 / 0.3)';
    const badgeColor = failCount>0 ? 'rgb(252 165 165)' : 'rgb(134 239 172)';
    el.innerHTML = `
    <div class="report-section">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div class="section-title" style="margin-bottom:0">⑤ 合规检查</div>
            <span style="font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600;background:${badgeBg};color:${badgeColor}">${passCount}/${checks.length} 通过</span>
        </div>
        ${checks.map(c=>`
        <div class="${itemClass(c.val)}">
            <span style="font-size:14px;flex-shrink:0">${icon(c.val)}</span>
            <div>
                <div style="font-weight:600;color:rgb(203 213 225)">${c.label}</div>
                <div style="font-size:11px;color:rgb(100 116 139);margin-top:2px">${c.desc}</div>
                ${c.val===null?`<div style="font-size:10px;color:rgb(71 85 105);margin-top:2px">（无数据，配置后自动检测）</div>`:''}
            </div>
        </div>`).join('')}
    </div>`;
}

// ─── Permissions Update Functions ─────────────────────────────────────────────
function toggleRolePerm(i, permKey) {
    const p = skills[currentKey].skillDef.permissions;
    p.roleMatrix[i][permKey] = !p.roleMatrix[i][permKey];
    autoSave(); renderRoleMatrix(); renderComplianceCheck();
}
function updateRoleMatrix(i, field, val) {
    const p = skills[currentKey].skillDef.permissions;
    if (!p.roleMatrix[i]) return;
    p.roleMatrix[i][field] = val;
    autoSave();
    if (field !== 'role') { renderRoleMatrix(); renderComplianceCheck(); }
}
function addRoleRow() {
    skills[currentKey].skillDef.permissions.roleMatrix.push({role:'',read:true,write:false,execute:false,approve:false});
    autoSave(); renderRoleMatrix();
}
function removeRoleRow(i) {
    skills[currentKey].skillDef.permissions.roleMatrix.splice(i,1);
    autoSave(); renderRoleMatrix(); renderComplianceCheck();
}
function updateCliOpName(i, val) {
    const p = skills[currentKey].skillDef.permissions;
    if (!p.cliOps[i]) return;
    p.cliOps[i].name = val;
    autoSave();
}
function updateCliOp(i, field, val) {
    const p = skills[currentKey].skillDef.permissions;
    if (!p.cliOps[i]) return;
    if (field==='requiresHitl') val = (val===true||val==='true');
    p.cliOps[i][field] = val;
    autoSave(); renderCliOps(); renderComplianceCheck();
}
function addCliOp() {
    skills[currentKey].skillDef.permissions.cliOps.push({name:'',riskLevel:'中风险',requiresHitl:false,approver:'',auditLevel:'标准'});
    autoSave(); renderCliOps(); renderComplianceCheck();
}
function removeCliOp(i) {
    skills[currentKey].skillDef.permissions.cliOps.splice(i,1);
    autoSave(); renderCliOps(); renderComplianceCheck();
}
function syncCliOpsFromSop() {
    const p = skills[currentKey].skillDef.permissions;
    const existing = new Set(p.cliOps.map(o=>o.name));
    let added = 0;
    extractCliOpNames(currentKey).forEach(name=>{
        if (!existing.has(name)) { p.cliOps.push({name,riskLevel:'中风险',requiresHitl:false,approver:'',auditLevel:'标准'}); added++; }
    });
    autoSave(); renderCliOps(); renderComplianceCheck();
    if (added===0) alert('没有新的 CLI 操作需要同步（SOP步骤中的操作已全部存在）');
}
function updateHitlNode(i, field, val) {
    const p = skills[currentKey].skillDef.permissions;
    if (!p.hitlNodes[i]) return;
    p.hitlNodes[i][field] = val;
    autoSave(); renderComplianceCheck();
}
function addHitlNode() {
    skills[currentKey].skillDef.permissions.hitlNodes.push({trigger:'',approver:'',timeoutRule:'',timeoutAction:''});
    autoSave(); renderHitlNodes(); renderComplianceCheck();
}
function removeHitlNode(i) {
    skills[currentKey].skillDef.permissions.hitlNodes.splice(i,1);
    autoSave(); renderHitlNodes(); renderComplianceCheck();
}
function addAuditEntry() {
    const now = new Date();
    const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    skills[currentKey].skillDef.permissions.auditLog.push({ts,operator:'',action:'',target:'',result:'成功',approvalChain:''});
    autoSave(); renderAuditLog();
}
function updateAuditEntry(i, field, val) {
    const p = skills[currentKey].skillDef.permissions;
    if (!p.auditLog[i]) return;
    p.auditLog[i][field] = val;
    autoSave();
}
function removeAuditEntry(i) {
    skills[currentKey].skillDef.permissions.auditLog.splice(i,1);
    autoSave(); renderAuditLog();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── Persist ──────────────────────────────────────────────────────────────────
function autoSave() {
    localStorage.setItem('crm-skills-v2', JSON.stringify(skills));
    const s = document.getElementById('save-status');
    s.classList.remove('hidden');
    clearTimeout(window._st);
    window._st = setTimeout(()=>s.classList.add('hidden'), 2000);
}
function exportSkillMd() {
    const s = skills[currentKey];
    if (!s) return;
    const d = s.skillDef || emptySkillDef();
    const sopTable = (d.sopSteps||[]).map(st=>
        `| ${st.step} | ${st.type} | ${st.logic} | ${st.dep} |`
    ).join('\n');
    const prohibitList = (d.prohibit||[]).filter(Boolean).map(p=>`  - [ ] ${p}`).join('\n');
    const permSection = buildPermMdSection(d.permissions);
    const md = `# SKILL.md — ${s.name}

## 1. 基本信息 (Basic Information)

- **Skill 名称**: ${s.name}
- **Skill ID**: ${s.skillId||''}
- **命令**: ${s.command||''}
- **所属层级**: ${s.layer||''} ${s.layer==='L1'?'基础原子层':s.layer==='L2'?'行业能力层':'企业专属层'}
- **Provider**: ${s.provider||''}
- **版本号**: ${s.version||'V1.0'}
- **描述**: ${s.description||''}

## 2. 判定依据 (Boundary Determination)

- **复用范围**: ${d.reuseScope||''}
- **语义依赖**: ${d.semanticDep||''}
- **判定口诀验证**: ${d.layerReason||''}

## 3. Ontology 依赖 (Ontology Dependencies)

- **实体 (Entities)**: ${d.ontoEntities||''}
- **角色 (Roles)**: ${d.ontoRoles||''}
- **状态 (Statuses)**: ${d.ontoStatuses||''}
- **规则约束 (Rules)**: ${d.ontoRules||''}

## 4. 执行逻辑与 SOP 拆解 (Execution Logic)

| 步骤 | 动作类型 | 逻辑描述 | 依赖项 |
| :--- | :--- | :--- | :--- |
${sopTable}

## 5. 调用机制设计 (Invocation Architecture)

- **类型 B 能力执行**: ${d.invocationB||''}
- **类型 C 系统操作 (CLI)**: ${d.invocationC||''}
- **HITL (人工环路)**: ${d.hitl||''}

## 6. 风险控制与反模式预防 (Risk Control)

### 禁止事项:
${prohibitList||'  - [ ] （待填写）'}

## 7. 验收标准 (Acceptance Criteria)

- **准确率**: ${d.kpiAccuracy||''}
- **覆盖率**: ${d.kpiCoverage||''}
- **时效性**: ${d.kpiLatency||''}
${permSection}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
    a.download = `SKILL_${(s.skillId||s.name.replace(/\s/g,'_'))}.md`;
    a.click();
}
function buildPermMdSection(p) {
    if (!p) return '';
    const hasData = (p.roleMatrix||[]).length>0||(p.cliOps||[]).length>0||(p.hitlNodes||[]).length>0;
    if (!hasData) return '';
    let sec = '\n## 8. 权限与安全配置 (Security & Permissions)\n';
    if ((p.roleMatrix||[]).length>0) {
        sec += '\n### 角色权限矩阵\n\n| 角色 | 读 | 写 | 执行 | 审批 |\n| :--- | :---: | :---: | :---: | :---: |\n';
        sec += p.roleMatrix.map(r=>`| ${r.role} | ${r.read?'✓':''} | ${r.write?'✓':''} | ${r.execute?'✓':''} | ${r.approve?'✓':''} |`).join('\n');
        sec += '\n';
    }
    if ((p.cliOps||[]).length>0) {
        sec += '\n### CLI 操作安全级别\n\n| 接口 | 风险级别 | 需要HITL | 审批人 | 审计级别 |\n| :--- | :---: | :---: | :--- | :--- |\n';
        sec += p.cliOps.map(op=>`| ${op.name} | ${op.riskLevel} | ${op.requiresHitl?'是':'否'} | ${op.approver||'—'} | ${op.auditLevel} |`).join('\n');
        sec += '\n';
    }
    if ((p.hitlNodes||[]).length>0) {
        sec += '\n### HITL 人工介入节点\n';
        p.hitlNodes.forEach((n,i)=>{
            sec += `\n**节点 ${i+1}**\n- 触发条件：${n.trigger||'—'}\n- 审批人：${n.approver||'—'}\n- 超时规则：${n.timeoutRule||'—'}\n- 超时处理：${n.timeoutAction||'—'}\n`;
        });
    }
    return sec;
}
function exportJSON() {
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(skills,null,2)],{type:'application/json'}));
    a.download='crm-skills-config.json'; a.click();
}
function importJSON() {
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange=e=>{
        const r=new FileReader(); r.readAsText(e.target.files[0]);
        r.onload=ev=>{ try{ skills=JSON.parse(ev.target.result); currentKey=Object.keys(skills)[0]; currentTab='basic'; renderSidebar(); renderEditor(); renderPreview(); autoSave(); }catch(err){alert('导入失败：'+err.message);} };
    }; inp.click();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
const saved = localStorage.getItem('crm-skills-v2');
if(saved){ try{ skills=JSON.parse(saved); }catch(e){} }
// ensure all skills have report
Object.values(skills).forEach(s=>{ if(!s.report) s.report=emptyReport(); });
// ensure all skills have skillDef.permissions
Object.values(skills).forEach(s=>{
    if(!s.skillDef) s.skillDef=emptySkillDef();
    if(!s.skillDef.permissions) s.skillDef.permissions=emptyPermissions();
});

currentKey = Object.keys(skills)[0];
setViewMode('biz'); // 默认业务视图
renderPreview();
</script>
