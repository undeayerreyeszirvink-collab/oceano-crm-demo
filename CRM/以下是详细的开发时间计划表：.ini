以下是详细的开发时间计划表：

第一阶段：顶层设计与数据地基 (第 1 - 2 周)
核心目标： 建立能容纳“梁倚萌模型”的数据字典，定义 60+ 个业务维度。

关键任务：

业务建模： 梳理经销商 360° 画像字段，定义“夫妻店、二代接班、同盟仓占比”等计算逻辑。

资产保护算法设计： 确定“商机报备 -> 锁定 -> 48h 失效 -> 回收公海”的底层代码逻辑。

技术选型： 搭建 React Native (或 Flutter) 移动端框架及 Node.js/Python 后端。

第二阶段：零感知采集引擎开发 (第 3 - 8 周)
核心目标： 实现“少干活”的技术抓手，这是最耗时的环节。

关键任务：

语音作战助手 (W3-W5)： 集成语音转文字接口，并构建 LLM 提示词工程，实现将非结构化语音自动拆解为“意向、痛点、任务”字段。

AI 拍照盘点引擎 (W5-W8)： 开发图像识别模型，训练识别欧神诺 Logo、陈列饱满度、以及竞品（如蒙娜丽莎）的视觉特征。

行为捕获插件 (W4-W6)： 开发与企业微信打通的文档追踪 SDK，记录客户阅读时长。

第三阶段：管理指挥舱与系统集成 (第 9 - 12 周)
核心目标： 让管理层看到“真实资产”，打通 BIP 和 OA。

关键任务：

数据集成层： 开发 BIP 订单数据、OA 售后工单的 API 对接，实现数据双向同步。

管理驾驶舱： 还原华中运营中心看板，开发“销售动作有效率”及“跟进质量评分”的自动推导算法。

提成锁定机制： 财务逻辑测试，确保系统记录与结算权限强关联。

第四阶段：实战演练与敏捷迭代 (第 13 - 16 周)
核心目标： 解决“组织排斥”，在华中等区域进行灰度测试。

关键任务：

Beta 测试： 选定 20 名种子业务员（如郑见等），进行实地跑单测试。

逻辑调优： 根据真实反馈优化 AI 识别的准确率（语音解析是否带方言、照片光线影响等）。

全量上线： 配合利益机制（提成保护）的正式宣贯，全面切换。
