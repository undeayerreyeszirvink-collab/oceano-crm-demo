<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>中国宠物行业协会 · AI增长平台</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fff7ed 0%, #fff 50%, #fef3e2 100%); margin: 0; }

        /* ── Animations ── */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .slide-in { animation: slideIn 0.5s ease-out forwards; }
        @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
        .scale-in { animation: scaleIn 0.4s ease-out forwards; }
        @keyframes scaleIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
        .result-card { animation: cardAppear 0.5s ease-out forwards; opacity:0; }
        @keyframes cardAppear { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

        /* ── AI ── */
        .ai-thinking::after { content:'...'; animation: dots 1.5s steps(4) infinite; }
        @keyframes dots { 0%,20% { content:'.'; } 40% { content:'..'; } 60%,100% { content:'...'; } }
        .loading-bar { height:4px; background:linear-gradient(90deg,#f97316,#fb923c,#fbbf24); animation:loadBar 2.5s ease-out forwards; }
        @keyframes loadBar { from { width:0%; } to { width:100%; } }
        .pulse-dot { animation: pulseDot 2s cubic-bezier(0.4,0,0.6,1) infinite; }
        @keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(1.15); } }

        /* ── Cards & Buttons ── */
        .pet-card { background:linear-gradient(135deg,#fff 0%,#fff7ed 100%); border:2px solid #fed7aa; transition:all 0.3s ease; }
        .pet-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(251,146,60,0.2); border-color:#fb923c; }
        .orange-btn { background:linear-gradient(135deg,#f97316,#ea580c); transition:all 0.2s ease; }
        .orange-btn:hover { background:linear-gradient(135deg,#ea580c,#c2410c); transform:translateY(-1px); box-shadow:0 4px 12px rgba(249,115,22,0.4); }
        .orange-btn:active { transform:translateY(0); }
        .ai-badge { background:linear-gradient(135deg,#f97316,#dc2626); }
        .step-active { border-left:3px solid #f97316; background:#fff7ed; }
        textarea { resize:none; }

        /* ── Nav (desktop top / mobile bottom) ── */
        .desktop-nav { display:flex; }
        .mobile-bottom-nav { display:none; }

        /* ── Mobile layout ── */
        @media (max-width: 767px) {
            .desktop-nav { display:none; }
            .mobile-bottom-nav { display:flex; }
            .mobile-pad { padding-bottom: 72px; }
            .ai-widget { bottom: 84px !important; right: 12px !important; max-width: calc(100vw - 24px); }
            .hero-title { font-size: 2rem !important; line-height: 1.2 !important; }
            .hero-sub { font-size: 1rem !important; }
            .page-py { padding-top: 1.5rem; padding-bottom: 1.5rem; }
            .page-px { padding-left: 1rem; padding-right: 1rem; }
            .hide-mobile { display:none !important; }
            .stat-grid { grid-template-columns: repeat(2,1fr) !important; }
        }
        @media (min-width: 768px) {
            .mobile-only { display:none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ─── AI Floating Widget ─── */
        function AIAssistant({ message, show }) {
            if (!show) return null;
            return (
                <div className="fixed ai-widget bg-gradient-to-r from-orange-500 to-red-500 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 slide-in z-50" style={{bottom:'1.5rem',right:'1.5rem',maxWidth:'18rem'}}>
                    <div className="text-2xl pulse-dot flex-shrink-0">🐾</div>
                    <div>
                        <div className="font-semibold text-xs">AI 分析助手</div>
                        <div className="text-xs opacity-90 ai-thinking">{message}</div>
                    </div>
                </div>
            );
        }

        /* ─── AI Step Progress ─── */
        function AILoading({ steps, currentStep }) {
            return (
                <div className="bg-white rounded-2xl p-5 border-2 border-orange-200 mb-6 slide-in shadow-sm">
                    <div className="flex items-center gap-3 mb-3">
                        <div className="text-2xl pulse-dot">🐶</div>
                        <div className="flex-1">
                            <div className="font-bold text-gray-900 text-sm">AI 正在分析</div>
                            <div className="text-sm text-orange-600 font-medium ai-thinking">{steps[currentStep]}</div>
                        </div>
                        <div className="text-xs text-gray-400 bg-orange-50 px-2 py-1 rounded-full flex-shrink-0">{currentStep+1}/{steps.length}</div>
                    </div>
                    <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden mb-2">
                        <div className="loading-bar rounded-full"></div>
                    </div>
                    <div className="space-y-1">
                        {steps.map((s,i) => (
                            <div key={i} className={`text-xs px-3 py-1.5 rounded-lg transition-all ${i<=currentStep ? 'step-active text-orange-800 font-medium' : 'text-gray-400'}`}>
                                {i<currentStep ? '✅ ' : i===currentStep ? '⚡ ' : '○ '}{s}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        /* ─── CountUp ─── */
        function CountUp({ target, suffix, duration }) {
            const [v, setV] = useState(0);
            useEffect(() => {
                let cur = 0;
                const step = target / (duration / 16);
                const t = setInterval(() => { cur += step; if (cur >= target) { setV(target); clearInterval(t); } else setV(Math.floor(cur)); }, 16);
                return () => clearInterval(t);
            }, [target, duration]);
            return <span>{v}{suffix}</span>;
        }

        /* ─── App Shell ─── */
        function App() {
            const [page, setPage] = useState(0);
            const [aiMsg, setAiMsg] = useState('');
            const [showAI, setShowAI] = useState(false);

            const triggerAI = (msg, dur=3000) => {
                setAiMsg(msg); setShowAI(true);
                setTimeout(() => setShowAI(false), dur);
            };
            const go = (p, label) => { setPage(p); triggerAI(`正在加载${label}...`); };

            const navItems = [
                { label:'首页', icon:'🏠', short:'首页' },
                { label:'政策商机', icon:'📜', short:'政策' },
                { label:'资源撮合', icon:'🐾', short:'撮合' },
                { label:'入会ROI', icon:'🐱', short:'ROI' },
                { label:'加入我们', icon:'🐶', short:'加入' },
            ];

            return (
                <div className="min-h-screen mobile-pad">
                    {/* ── Desktop top nav ── */}
                    <nav className="desktop-nav sticky top-0 z-50 shadow-sm" style={{background:'linear-gradient(135deg,#fff7ed,#fff)',borderBottom:'2px solid #fed7aa'}}>
                        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between w-full">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl flex items-center justify-center ai-badge shadow-md">
                                    <span className="text-lg">🐾</span>
                                </div>
                                <div>
                                    <div className="text-base font-bold text-gray-900">中国宠物行业协会</div>
                                    <div className="text-xs text-orange-600 font-medium">AI 增长平台 · 智能撮合系统</div>
                                </div>
                            </div>
                            <div className="flex gap-1">
                                {navItems.map((n,i) => (
                                    <button key={i} onClick={() => go(i, n.label)}
                                        className={`px-3 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-1.5 ${page===i ? 'bg-orange-100 text-orange-700 shadow-sm' : 'text-gray-600 hover:bg-orange-50 hover:text-orange-600'}`}>
                                        <span>{n.icon}</span>{n.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* ── Mobile top bar ── */}
                    <div className="mobile-only sticky top-0 z-50 flex items-center gap-2 px-4 py-3 shadow-sm" style={{background:'linear-gradient(135deg,#fff7ed,#fff)',borderBottom:'2px solid #fed7aa'}}>
                        <div className="w-8 h-8 rounded-xl flex items-center justify-center ai-badge shadow-sm">
                            <span className="text-base">🐾</span>
                        </div>
                        <div>
                            <div className="text-sm font-bold text-gray-900">中国宠物行业协会</div>
                            <div className="text-xs text-orange-500">AI 增长平台</div>
                        </div>
                    </div>

                    <main>
                        {page===0 && <LandingPage onNavigate={(p) => go(p, navItems[p].label)} />}
                        {page===1 && <PolicyPage onNavigate={p => go(p, navItems[p].label)} triggerAI={triggerAI} />}
                        {page===2 && <MatchingPage onNavigate={p => go(p, navItems[p].label)} triggerAI={triggerAI} />}
                        {page===3 && <ROIPage onNavigate={p => go(p, navItems[p].label)} triggerAI={triggerAI} />}
                        {page===4 && <ConversionPage onNavigate={p => go(p, navItems[p].label)} triggerAI={triggerAI} />}
                    </main>

                    {/* ── Mobile bottom tab bar ── */}
                    <nav className="mobile-bottom-nav fixed bottom-0 left-0 right-0 z-50 border-t-2 border-orange-100 shadow-lg" style={{background:'rgba(255,247,237,0.97)',backdropFilter:'blur(12px)'}}>
                        {navItems.map((n,i) => (
                            <button key={i} onClick={() => go(i, n.label)} style={{flex:1}}
                                className={`flex flex-col items-center justify-center py-2 gap-0.5 transition-all ${page===i ? 'text-orange-600' : 'text-gray-400'}`}>
                                <span className="text-xl">{n.icon}</span>
                                <span className="text-xs font-medium">{n.short}</span>
                                {page===i && <span className="w-1 h-1 rounded-full bg-orange-500 mt-0.5"></span>}
                            </button>
                        ))}
                    </nav>

                    <AIAssistant message={aiMsg} show={showAI} />
                </div>
            );
        }

        /* ─── Screen 1: Landing ─── */
        function LandingPage({ onNavigate }) {
            return (
                <div className="fade-in">
                    <div className="py-14 page-py" style={{background:'linear-gradient(135deg,#fff7ed 0%,#fff 60%,#fef3e2 100%)'}}>
                        <div className="max-w-4xl mx-auto px-6 page-px text-center">
                            <div className="inline-flex items-center gap-2 bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-semibold mb-5 shadow-sm">
                                <span className="pulse-dot">🐾</span> AI驱动 · 宠物行业专属增长引擎
                            </div>
                            <h1 className="hero-title font-black text-gray-900 mb-4 leading-tight" style={{fontSize:'3rem'}}>
                                让宠物行业协会<br/>成为会员的<span className="text-orange-500">增长引擎</span>
                            </h1>
                            <p className="hero-sub text-gray-600 mb-8 max-w-2xl mx-auto leading-relaxed" style={{fontSize:'1.125rem'}}>
                                从"发通知"到"做生意"：用 AI 把宠物行业政策、供应链资源、会员需求转化为真实收入
                            </p>
                            <button onClick={() => onNavigate(1)} className="orange-btn text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-xl w-full sm:w-auto">
                                🚀 体验 AI 演示
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 page-px py-12">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                            {[
                                { title:'政策 → 商机', desc:'AI 自动解析宠物行业政策，输出补贴申报路径与合规商机方案', icon:'📜', p:1 },
                                { title:'资源 → 撮合', desc:'精准匹配宠物品牌商、供应商与渠道商，AI 提升合作成交率', icon:'🐾', p:2 },
                                { title:'入会 → ROI', desc:'量化加入协会的真实收益：补贴、订单、资质认证一键测算', icon:'🐱', p:3 },
                            ].map((f,i) => (
                                <div key={i} onClick={() => onNavigate(f.p)} className="pet-card rounded-2xl p-6 cursor-pointer">
                                    <div className="text-4xl mb-3">{f.icon}</div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-2">{f.title}</h3>
                                    <p className="text-gray-600 text-sm leading-relaxed">{f.desc}</p>
                                    <div className="mt-3 text-orange-500 font-semibold text-sm flex items-center gap-1">查看演示 →</div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-10 grid grid-cols-2 md:grid-cols-4 gap-4 stat-grid text-center">
                            {[
                                { n:'3,200+', label:'注册会员企业', icon:'🏢' },
                                { n:'87%', label:'AI 匹配准确率', icon:'🎯' },
                                { n:'¥12亿+', label:'累计撮合金额', icon:'💰' },
                                { n:'30x', label:'平均入会 ROI', icon:'📈' },
                            ].map((s,i) => (
                                <div key={i} className="bg-white rounded-2xl p-4 shadow-sm border border-orange-100">
                                    <div className="text-2xl mb-1">{s.icon}</div>
                                    <div className="text-2xl font-black text-orange-500">{s.n}</div>
                                    <div className="text-xs text-gray-500 mt-0.5">{s.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        /* ─── Screen 2: Policy ─── */
        function PolicyPage({ onNavigate, triggerAI }) {
            const [policyText, setPolicyText] = useState('《关于促进宠物行业规范化发展及品牌扶持专项政策（2026）》');
            const [stage, setStage] = useState('idle');
            const [step, setStep] = useState(0);
            const [visible, setVisible] = useState(0);

            const steps = ['读取政策原文与行业数据库...','识别适用企业类型与资质要求...','匹配可获补贴与商机路径...','生成可执行操作方案...'];

            const run = () => {
                if (stage==='loading') return;
                setStage('loading'); setStep(0); setVisible(0);
                triggerAI('AI 正在解析宠物行业政策...', 8000);
                [0,700,1500,2200].forEach((t,i) => setTimeout(()=>setStep(i),t));
                setTimeout(() => { setStage('done'); [0,1,2,3].forEach(i=>setTimeout(()=>setVisible(v=>v+1),i*300)); }, 3000);
            };

            const results = [
                { icon:'🐱', title:'适合企业类型', items:['宠物食品生产企业（年营收 > 3000万）','宠物医疗连锁机构','宠物用品品牌商/代理商'], color:'blue' },
                { icon:'💰', title:'可获得收益（重点）', items:['品牌认证补贴：最高 150万','政府采购（动物防疫物资）：优先入围名录','出口退税支持：合同额的 3%–5%'], color:'green', hi:true },
                { icon:'🗺️', title:'操作路径（可执行）', items:['① 申请行业资质备案（协会推荐）','② 提交品牌合规材料','③ 进入政府采购候选池','④ 参与招标 / 定向采购'], color:'orange' },
                { icon:'🏛️', title:'协会关键角色', items:['提供政策解读与申报模板','推荐进入政府候选名单','对接宠物行业头部渠道资源'], color:'purple' },
            ];
            const cc = { blue:'bg-blue-50 border-blue-200', green:'bg-green-50 border-green-300', orange:'bg-orange-50 border-orange-200', purple:'bg-purple-50 border-purple-200' };

            return (
                <div className="max-w-5xl mx-auto px-6 page-px py-10 page-py fade-in">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <span className="text-3xl">📜</span>
                        <h2 className="text-2xl font-black text-gray-900">政策 → 商机</h2>
                        <span className="bg-orange-100 text-orange-700 text-xs px-3 py-1 rounded-full font-semibold">AI 实时解析</span>
                    </div>
                    <p className="text-gray-500 text-sm mb-6 ml-10">输入政策名称，AI 自动识别可获补贴、操作路径与协会价值</p>

                    <div className="bg-white rounded-2xl p-5 border-2 border-orange-100 shadow-sm mb-6">
                        <label className="block text-sm font-bold text-gray-700 mb-2">🐾 政策名称（可编辑）</label>
                        <textarea value={policyText} onChange={e=>setPolicyText(e.target.value)} rows={2}
                            className="w-full border-2 border-orange-200 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:border-orange-400 text-sm bg-orange-50 mb-4" />
                        <div className="flex flex-wrap items-center gap-3">
                            <button onClick={run} disabled={stage==='loading'}
                                className={`px-6 py-3 rounded-xl font-bold text-white shadow-md transition-all text-sm ${stage==='loading' ? 'bg-gray-400 cursor-not-allowed' : 'orange-btn'}`}>
                                {stage==='loading' ? '🐶 AI 分析中...' : '⚡ AI 解析政策'}
                            </button>
                            {stage==='done' && <span className="text-green-600 font-semibold text-sm">✅ 分析完成</span>}
                            <span className="text-xs text-gray-400 ml-auto hide-mobile">由宠物行业数据库 + 政策语义引擎支持</span>
                        </div>
                    </div>

                    {stage==='loading' && <AILoading steps={steps} currentStep={step} />}

                    {stage==='done' && (
                        <div className="space-y-4">
                            {results.map((r,i) => i<visible && (
                                <div key={i} className={`result-card rounded-2xl p-5 border-2 ${cc[r.color]}`}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="text-2xl">{r.icon}</span>
                                        <h3 className="font-bold text-gray-900 text-sm">{r.title}</h3>
                                        {r.hi && <span className="ml-auto bg-green-500 text-white text-xs px-2 py-0.5 rounded-full">重点</span>}
                                    </div>
                                    <ul className="space-y-1.5">
                                        {r.items.map((item,j) => (
                                            <li key={j} className="text-sm text-gray-700 flex items-start gap-2">
                                                <span className="text-orange-400 mt-0.5 flex-shrink-0">▸</span><span>{item}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                            {visible>=4 && (
                                <div className="result-card bg-gradient-to-r from-orange-50 to-amber-50 border-2 border-orange-300 rounded-2xl p-4 text-center">
                                    <p className="text-orange-800 font-bold text-sm">🔥 协会会员可获得优先推荐资格，提升中标概率约 <span className="text-xl text-orange-600">30%–50%</span></p>
                                </div>
                            )}
                            {visible>=4 && (
                                <div className="result-card flex flex-col sm:flex-row gap-3">
                                    <button className="flex-1 orange-btn text-white py-3 rounded-xl font-bold shadow-md text-sm">获取完整申报路径</button>
                                    <button onClick={()=>onNavigate(4)} className="flex-1 bg-white border-2 border-orange-500 text-orange-600 py-3 rounded-xl font-bold hover:bg-orange-50 transition text-sm">申请会员支持</button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        /* ─── Screen 3: Matchmaking ─── */
        const RESOURCE_TYPES = [
            {
                key: 'enterprise',
                label: '企业资源',
                icon: '🏪',
                color: 'green',
                demandLabel: '需求方企业',
                demandDefault: '某宠物食品品牌商（华东区，30人）',
                demandDesc: ['需求：进入连锁宠物店采购体系 + 品牌背书', '痛点：无渠道 / 无认证'],
                supplyLabel: '资源方企业',
                supplyDefault: '某全国连锁宠物超市（全国800+门店）',
                supplyDesc: ['资源：年采购预算 5000万 / 全国 800+ 门店', '需求：寻找优质宠物食品供应商'],
                score: 87,
                path: '企业A → 协会推荐 → 连锁超市试点 → 进入采购名录',
                prob: '65%',
                probBaseline: 'vs 无协会 25%',
                deal: '¥200–800万',
                reasons: ['🐟 行业匹配（宠物食品供需对齐）','✅ 品质认证要求方向一致','🏪 连锁超市当前存在供应缺口'],
                highlight: '通过协会推荐通道，可跳过初筛环节，直接进入采购评估',
            },
            {
                key: 'expert',
                label: '宠物专家',
                icon: '🐾',
                color: 'purple',
                demandLabel: '需求方企业',
                demandDefault: '某宠物医疗连锁机构（全国50家诊所）',
                demandDesc: ['需求：引入临床营养/行为学专家顾问', '痛点：缺乏权威专家背书 / 医疗方案待优化'],
                supplyLabel: '宠物专家',
                supplyDefault: '资深宠物营养师·执业兽医（从业15年）',
                supplyDesc: ['专长：宠物临床营养、慢病管理、行为矫正', '可提供：方案设计 / 培训 / 品牌背书'],
                score: 92,
                path: '机构 → 协会专家库 → 精准匹配 → 签约顾问合作',
                prob: '78%',
                probBaseline: 'vs 自主寻找 20%',
                deal: '顾问费 50–200万/年',
                reasons: ['🩺 专业方向与机构需求高度吻合','🏆 专家拥有行业权威认证背书','📋 协会已完成资质核验，可直接对接'],

                            <div className="bg-white rounded-xl p-4 border border-gray-200">
                                <div className="text-xs font-semibold text-gray-500 mb-2">加入前</div>
                                <div className="text-gray-700 text-xs leading-relaxed">• 无渠道合作，依赖线下展会<br/>• 无行业认证，采购商不信任<br/>• 年渠道成交额：约 50万</div>
                            </div>
                            <div className="bg-green-50 rounded-xl p-4 border border-green-200">
                                <div className="text-xs font-semibold text-green-700 mb-2">加入后（6个月）</div>
                                <div className="text-gray-700 text-xs leading-relaxed">• 获得 3 家连锁超市合作机会<br/>• 成交 2 家（约 400万）<br/>• ROI = <span className="font-bold text-green-600 text-sm">133x</span></div>
                            </div>
                        </div>
                    </div>

                    {!submitted ? (
                        <div className="bg-white rounded-2xl p-6 border-2 border-orange-100 shadow-sm max-w-lg mx-auto">
                            <h3 className="font-bold text-gray-900 mb-4 text-center text-sm">🐶 申请会员 · AI 为您生成专属方案</h3>
                            <div className="space-y-3">
                                <div><label className="text-xs font-semibold text-gray-500 mb-1 block">姓名 *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="如：张总" className={inp} /></div>
                                <div><label className="text-xs font-semibold text-gray-500 mb-1 block">公司名称 *</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="如：某宠物食品有限公司" className={inp} /></div>
                                <div><label className="text-xs font-semibold text-gray-500 mb-1 block">联系电话</label><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="方便顾问与您联系" className={inp} /></div>
                                <button onClick={submit} disabled={submitting}
                                    className={`w-full py-4 rounded-xl font-bold text-white shadow-lg transition-all ${submitting ? 'bg-gray-400 cursor-not-allowed' : 'orange-btn'}`}>
                                    {submitting ? <span className="ai-thinking">🐾 AI 正在生成专属方案</span> : '🚀 立即申请会员'}
                                </button>
                                <p className="text-xs text-gray-400 text-center">填写即视为同意协会服务条款 · 顾问将在1个工作日内联系</p>
                            </div>
                        </div>
                    ) : (
                        <div className="scale-in bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-8 border-2 border-green-300 shadow-lg text-center max-w-lg mx-auto">
                            <div className="text-5xl mb-3">🎉</div>
                            <h3 className="text-xl font-black text-gray-900 mb-2">申请已提交！</h3>
                            <p className="text-gray-600 mb-4 text-sm">AI 已为 <span className="font-bold text-gray-900">{company}</span> 生成专属入会方案</p>
                            <div className="bg-white rounded-xl p-4 border border-green-200 text-left text-xs space-y-2 mb-5">
                                <div>🐾 预计可申请补贴：<span className="font-bold text-green-600">50万–150万</span></div>
                                <div>🏪 可对接渠道资源：<span className="font-bold text-blue-600">3–5家</span></div>
                                <div>🤖 AI 匹配启动时间：<span className="font-bold text-orange-600">入会后 48小时内</span></div>
                            </div>
                            <button onClick={()=>{ setSubmitted(false); setName(''); setCompany(''); setPhone(''); }} className="text-xs text-gray-400 hover:text-gray-600">重新填写</button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
