// Pre-Product 场景对话
const CONV_PRE_PRODUCT = [
  { ph:0, r:'yc', t:'你好，我是 Michael Seibel，YC CEO。\n\n我看到你选择了 **Pre-Product 需求验证**。在我们开始之前，我需要了解你的具体情况。\n\n**请用 2-3 句话描述：你想做什么？现在最大的困惑是什么？**' },
  { ph:1, r:'founder', t:'我叫张明，之前做了 8 年兽医。我想做一个 AI 宠物分诊助手——帮宠物主人判断"要不要去医院"。现在还没有产品，只有一个想法。\n\n最大的困惑是：先做 App 还是先找用户？' },
  { ph:1, r:'yc', t:'**先找用户。这是唯一正确的顺序。**\n\n你现在是 pre-product 阶段，我会用 YC 的六问框架帮你验证需求真实性。这些问题会很直接，甚至不舒服——但这正是你需要的。\n\n准备好了吗？' },
  { ph:1, r:'founder', t:'准备好了。' },

  // Phase 2: 深度追问
  { ph:2, r:'yc', t:'**Q1 · 需求真实性**\n\n有没有人**真的**想要这个东西？不是"觉得有用"，是真的想要——愿意付钱、愿意改变习惯、如果你的服务挂了会打电话来骂你的那种。' },
  { ph:2, r:'founder', t:'我问过几个朋友，他们都觉得这个想法很好，说如果有这个工具会用的。' },
  { ph:2, r:'yc', t:'**停。"朋友觉得有用"不是需求。**\n\n朋友不会伤害你的感情，所以他们说"好"。这不算数据。\n\n**有没有人主动找过你，问你宠物的健康问题？有没有人在你的服务挂了之后催你？**' },
  { ph:2, r:'founder', t:'有。我在几个宠物微信群里，经常有人@我问问题。上周就有三个人问我他们的猫是不是需要去医院。有一次我两天没回复，有个用户私信我说很着急。' },
  { ph:2, r:'yc', t:'**这才是真实需求。**用户催你，说明他们真的需要。\n\n**Q2 · 现状替代方案**\n\n这些人现在怎么解决这个问题？如果没有你，他们怎么办？他们为现有方案付出了什么代价？' },
  { ph:2, r:'founder', t:'要么直接去宠物医院（300-800元/次），要么在网上搜（信息不可靠），要么就在群里问。去医院贵，而且很多时候只是虚惊一场，白跑一趟。' },
  { ph:2, r:'yc', t:'所以你要解决的核心问题是：**"要不要去医院"这个判断**。\n\n你不是在替代兽医，你是在做**分诊**——帮人省掉不必要的就诊。这个定位很清晰。\n\n每次不必要就诊的成本是 300-800 元 + 2-3 小时时间。这是你的价值锚点。' },
  { ph:2, r:'founder', t:'对，就是这个。我之前一直说"AI 宠物医生"，但其实核心是分诊判断。' },
  { ph:2, r:'yc', t:'**Q3 · 极度具体**\n\n给我说一个具体的人。不是"宠物主人"这个群体，是一个真实的人——名字、年龄、职业、他们的宠物、他们的具体问题、他们每年在宠物上花多少钱。' },
  { ph:2, r:'founder', t:'李梅，35 岁，在上海做 HR，月收入 1.8 万。有一只 12 岁的老年猫叫"豆腐"。上周她问我豆腐最近不爱吃东西，是不是要去医院。她每年在豆腐身上花 5000-8000 元，其中 2000 元是不必要的就诊。' },
  { ph:2, r:'yc', t:'**很好。李梅就是你的目标用户。**\n\n她每年浪费 2000 元在不必要就诊上。如果你能帮她省掉一半，就是 1000 元/年的价值。\n\n**Q4 · 最窄切入点**\n\n你现在怎么接触到李梅这样的人？你的第一个 10 个付费用户从哪里来？不要告诉我"做广告"或"SEO"——我要的是这周就能执行的方案。' },
  { ph:2, r:'founder', t:'就是那些微信群。我在 3 个宠物群里，总共 800 人左右。我在里面已经有一定信任度了，大家知道我是兽医。我可以直接在群里提供付费咨询服务。' },
  { ph:2, r:'yc', t:'**这是你最大的资产。**800 个已经信任你的潜在用户，获客成本为零。\n\n你觉得李梅愿意为"随时问兽医"这个服务付多少钱？' },
  { ph:2, r:'founder', t:'我想过，大概 99 元一个月？可以无限次问问题，3 分钟内响应。' },
  { ph:2, r:'yc', t:'99 元/月 = 1188 元/年。她每年浪费 2000 元，你收 1188 元，ROI 是正的。定价合理。\n\n**Q5 · 亲眼观察**\n\n你有没有亲眼看过李梅在用现有工具解决这个问题？她是怎么搜索的，怎么做决定的？她在哪个环节最痛苦？' },
  { ph:2, r:'founder', t:'没有亲眼看过。但我在群里帮她解答过三四次了，知道她的决策过程——她会先描述症状（很详细，有照片），然后问"严不严重"，最后问"要不要去医院"。她最痛苦的是**不确定性**——不知道是小问题还是大问题。' },
  { ph:2, r:'yc', t:'**你已经在手动做这件事了。这很有价值。**\n\n你现在要做的不是"开发产品"，而是**把手动服务变成付费服务**。产品可以等，收钱不能等。\n\n**Q6 · 未来适配性**\n\n如果这个做成了，3 年后是什么样子？你想做的是一个工具，还是一个平台？' },
  { ph:2, r:'founder', t:'我想做宠物健康管理平台，连接宠物主人、兽医和宠物医院。AI 分诊只是入口，后面可以做健康档案、疫苗提醒、保险对接。' },

  // Phase 3: 前提挑战
  { ph:3, r:'yc', t:'**等一下。我要挑战你的前提。**\n\n**前提 1：AI 误判怎么办？**\n如果 AI 说"不用去医院"，结果猫死了，你怎么处理这个责任？这不是技术问题，是信任和法律问题。' },
  { ph:3, r:'founder', t:'这是我最担心的。所以我的想法是：AI 只做初步筛查，给出"建议就医"或"可以观察"，最终决定权在用户。而且我有兽医执照，可以做背书。所有建议都会加免责声明。' },
  { ph:3, r:'yc', t:'**兽医执照是你最大的护城河。**大多数做宠物 AI 的人没有这个。\n\n但注意：你的定位必须是"辅助判断工具"，不能是"AI 医生"。措辞很重要，会影响法律风险。\n\n**前提 2：人工服务不可扩展**\n你一个人能服务多少用户？20 个？50 个？如果有 200 个用户，你怎么办？' },
  { ph:3, r:'founder', t:'我算过，如果每个用户平均每周问 2 次，每次回复 5 分钟，20 个用户就是 200 分钟/周，大概 3-4 小时。50 个用户就是 8-10 小时/周，还能接受。200 个用户就需要雇人或者用 AI 辅助了。' },
  { ph:3, r:'yc', t:'**很好，你算过账。**\n\n这就是为什么我建议你先做 20 个用户——验证需求 + 积累数据 + 测试定价。3 个月后，你会知道：\n1. 用户真实付费意愿\n2. 常见问题类型（可以做 AI 训练）\n3. 服务成本和时间\n4. 是否需要转向 AI 产品\n\n**前提确认：**\n✓ 分诊工具，不是诊断工具\n✓ 兽医执照是核心差异化\n✓ 微信群是最快切入点\n✓ 先做 20 个用户验证，再考虑扩展' },

  // Phase 4: 方案设计
  { ph:4, r:'yc', t:'ALTERNATIVES', isAlternatives: true },
  { ph:4, r:'founder', t:'方案 A。我现在没有资金，也没有团队，先验证需求最重要。而且我可以立即开始，这周就能收到第一笔钱。' },
  { ph:4, r:'yc', t:'**正确答案。**\n\n方案 A 是唯一务实的选择。方案 B 是大多数技术创始人的陷阱——先做产品，再找用户。你已经有用户了，**先收钱**。\n\n方案 C 不是不好，但 B2B 销售会消耗你大量时间，而你现在最需要的是**快速验证**。\n\n我来给你出一份完整的执行计划和风险评估报告。' },

  // Phase 5: 执行计划
  { ph:5, r:'yc', t:'EXECUTION', isExecution: true },

  // Phase 6: 风险评估
  { ph:6, r:'yc', t:'RISKS', isRisks: true },

  // Phase 7: 完整报告
  { ph:7, r:'yc', t:'REPORT', isReport: true },
];

// 融资场景对话
const CONV_FUNDRAISING = [
  { ph:0, r:'yc', t:'你好，我是 Michael Seibel，YC CEO。\n\n我看到你选择了 **融资准备与策略**。在我们开始之前，我需要了解你的具体情况。\n\n**请告诉我：\n1. 你的公司现在处于什么阶段？（Pre-seed / Seed / Pre-A / A轮）\n2. 你想融多少钱？\n3. 最大的困惑是什么？**' },
  { ph:1, r:'founder', t:'我们是一家 B2B SaaS 公司，做企业知识管理平台。现在有 15 个付费客户，月收入 8 万，团队 5 人。\n\n我们想融 Pre-A 轮，目标 500-800 万美元。\n\n最大的困惑是：投资人总说我们"增长不够快"，但我们不知道怎么加速增长。而且不确定现在的估值应该是多少。' },
  { ph:1, r:'yc', t:'**好，我听到了三个问题：**\n1. 增长速度\n2. 估值定价\n3. 融资策略\n\n在回答这些之前，我需要先了解你的**单位经济模型**。这是投资人最关心的。\n\n**请回答：**\n- 客单价多少？\n- CAC（获客成本）多少？\n- LTV（客户生命周期价值）多少？\n- Churn rate（流失率）多少？' },
  { ph:2, r:'founder', t:'客单价：年费 5 万/客户\nCAC：大概 2 万（销售成本 + 市场费用）\nLTV：还没算过，但平均客户留存 18 个月\nChurn rate：月流失率 5%\n\n我们的问题是：获客成本太高，销售周期太长（平均 3 个月）。' },
  { ph:2, r:'yc', t:'**让我算一下你的单位经济模型：**\n\n```\n客单价：5万/年\nCAC：2万\nLTV = 客单价 × 平均留存月数 = 5万 × 18/12 = 7.5万\nLTV/CAC = 7.5万 / 2万 = 3.75\n```\n\n**你的 LTV/CAC 是 3.75，这是健康的**（一般要求 >3）。\n\n但你的月流失率 5% 太高了。这意味着：\n- 年流失率 = 1 - (1-0.05)^12 = 46%\n- 平均客户生命周期 = 1/0.05 = 20个月\n\n**这是你最大的问题。**不是增长不够快，是**留存不够好**。\n\n投资人看到 5% 的月流失率，会担心你的产品 PMF 还不够强。' },
  { ph:2, r:'founder', t:'我们也意识到了流失率的问题。主要是因为有些客户买了之后，使用率很低，续费的时候就流失了。\n\n我们现在在做客户成功团队，希望提高使用率。' },
  { ph:3, r:'yc', t:'**这是正确的方向。但我要挑战你的前提：**\n\n**前提 1：你确定你的产品真的解决了客户的核心问题吗？**\n\n使用率低，通常不是"客户成功"的问题，而是**产品价值**的问题。\n\n你的 15 个客户里，有没有那种"如果你的产品挂了，他们会打电话来骂你"的客户？' },
  { ph:3, r:'founder', t:'有 3-4 个客户是这样的。他们每天都在用，而且会主动给我们提需求。但其他客户确实使用频率很低。' },
  { ph:3, r:'yc', t:'**这就是问题所在。**\n\n你有 3-4 个**真正的用户**，和 11-12 个**试用用户**。\n\n**我的建议：**\n1. **停止扩张，专注留存。**在流失率降到 2% 以下之前，不要再花钱获客。\n2. **深度访谈那 3-4 个重度用户。**搞清楚他们为什么离不开你，然后把产品做成那个样子。\n3. **砍掉那些不用的功能。**使用率低的客户，通常是因为产品太复杂。\n\n**关于融资：**\n现在融资，你会拿到很差的条款。因为投资人会说"增长不够快"（其实是留存不够好）。\n\n**我建议你：**\n- 用 3 个月时间，把月流失率降到 2%\n- 把那 3-4 个重度用户的案例做成标杆\n- 然后再融资，估值会高 50%\n\n**你愿意等 3 个月吗？**' },
  { ph:4, r:'founder', t:'我们账上还有 6 个月现金。如果 3 个月能把留存做好，确实值得等。\n\n但我担心的是：如果 3 个月后还是没做好怎么办？那时候现金只剩 3 个月了，融资会更被动。' },
  { ph:4, r:'yc', t:'**这是一个合理的担心。**\n\n让我给你两个方案：\n\n**方案 A：现在融资（保守）**\n- 优点：现金安全，有 12-18 个月 runway\n- 缺点：估值低，稀释多，条款差\n- 适合：如果你对产品 PMF 不自信\n\n**方案 B：3 个月后融资（激进）**\n- 优点：估值高 50%，条款好，投资人抢着投\n- 缺点：有风险，如果 3 个月没做好，会很被动\n- 适合：如果你对产品 PMF 有信心\n\n**我的建议：方案 B，但要设置里程碑。**\n\n3 个月后，如果达到这些指标，就融资：\n- 月流失率 < 2%\n- 月收入增长 > 15%\n- 有 5 个以上重度用户\n\n如果没达到，立即启动融资，接受更差的条款。\n\n**你选哪个？**' },
  { ph:5, r:'founder', t:'我选方案 B。我们对产品有信心，而且 3 个月足够我们验证了。' },
  { ph:5, r:'yc', t:'FUNDRAISING_PLAN', isFundraisingPlan: true },
  { ph:6, r:'yc', t:'FUNDRAISING_RISKS', isFundraisingRisks: true },
  { ph:7, r:'yc', t:'FUNDRAISING_REPORT', isFundraisingReport: true },
];

// ─── 融资场景数据 ───────────────────────────────────────────────

      tasks: [
        '深度访谈 3-4 个重度用户，找到核心价值点',

        '建立客户成功流程：入职培训 + 周报 + 季度回顾',
        '设置健康度评分系统，提前预警流失风险'
      ],
      metrics: ['月流失率 < 2%', '重度用户 NPS > 60', '功能使用率 > 40%']
    },
    {

      goal: '月收入增长 > 15%',
      tasks: [
        '基于重度用户案例，打磨 3 个标杆客户故事',
        '开启 PLG（产品驱动增长）：免费试用 + 自助注册',
        '建立合作伙伴渠道：咨询公司 + 系统集成商',
        '优化定价：年付折扣 + 企业版套餐'
      ],
      metrics: ['月收入增长 > 15%', '新增付费客户 ≥ 3', '年付比例 > 30%']

    {

      <div style="color:#6b7280;font-size:.8rem">预算：${r.cost}</div>
    </div>`).join('')}

  <h2>决策框架</h2>
  <div class="card green"><strong>GO 标准：</strong><ul>${rows(report.decision_framework.go_criteria)}</ul></div>
  <div class="card red"><strong>NO-GO 标准：</strong><ul>${rows(report.decision_framework.no_go_criteria)}</ul></div>

  <div class="footer">由 YC Office Hours 专业创业问答平台生成 · ${report.date} · 可直接打印或分享给投资人</div>
</div>
</body>
</html>`;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `YC-Office-Hours-报告-${report.founder}-${report.date}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

        <div key={i} className="flex items-center gap-1 flex-shrink-0">

function App() {
  const [selectedScenario, setSelectedScenario] = useState('pre-product');
  const [shown, setShown] = useState(0);
  const [typing, setTyping] = useState(false);
  const [autoPlay, setAuto] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const chatRef = useRef(null);
  const timerRef = useRef(null);

  const conversation = selectedScenario === 'pre-product' ? CONV_PRE_PRODUCT : selectedScenario === 'fundraising' ? CONV_FUNDRAISING : [];
  const currentPhase = shown > 0 ? conversation[shown - 1].ph : 0;
  const done = shown >= conversation.length;

  const handleScenarioSelect = (scenarioId) => {
    setSelectedScenario(scenarioId);
    setShown(0);
    setTyping(false);
    setAuto(false);
    setSidebarOpen(false);
  };

  const advance = () => {
    if (done) return;
    const next = conversation[shown];
    if (next.r === 'yc') {
      setTyping(true);
      const delay = next.isAlternatives || next.isExecution || next.isRisks || next.isReport ? 1000 : Math.min(600 + next.t.length * 7, 2200);
      timerRef.current = setTimeout(() => { setTyping(false); setShown(s => s + 1); }, delay);
    } else {
      setShown(s => s + 1);
    }
  };

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [shown, typing]);

  useEffect(() => {
    if (!autoPlay || done) return;
    const delay = typing ? 100 : (shown > 0 && conversation[shown - 1].r === 'founder' ? 1000 : 300);
    timerRef.current = setTimeout(advance, delay);
    return () => clearTimeout(timerRef.current);
  }, [autoPlay, shown, typing, done]);

  useEffect(() => () => clearTimeout(timerRef.current), []);

  return (
    <div className="flex h-screen" style={{background:'#0a0a0a'}}>
      {/* Mobile Overlay */}
      {sidebarOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"
          onClick={() => setSidebarOpen(false)} />
      )}

      {/* Left Sidebar */}
      <div className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 fixed md:relative w-64 h-full flex-shrink-0 flex flex-col z-30 transition-transform duration-300`}
        style={{background:'#171717',borderRight:'1px solid #2d2d2d'}}>
        <div className="p-4 border-b" style={{borderColor:'#2d2d2d'}}>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center text-white font-black text-xs shadow"
              style={{background:'linear-gradient(135deg,#f97316,#ea580c)'}}>YC</div>
            <div>
              <div className="text-sm font-bold text-white">Office Hours</div>
              <div className="text-xs" style={{color:'#9ca3af'}}>专业创业问答</div>
            </div>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-3">
          <div className="space-y-4">
            {/* 产品与市场 */}

              <div className="text-xs font-semibold mb-2 px-2" style={{color:'#6b7280'}}>产品与市场</div>

            {/* 团队与战略 */}
            <div>
              <div className="text-xs font-semibold mb-2 px-2" style={{color:'#6b7280'}}>团队与战略</div>
              <div className="space-y-1">
                <button onClick={() => handleScenarioSelect('team')}
                  className="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-all"
                  style={selectedScenario === 'team'
                    ? {background:'#f97316', color:'white'}
                    : {background:'transparent', color:'#9ca3af'}}>
                  <div className="flex items-center gap-2">
                    <span className="text-base">👥</span>
                    <span className="text-xs">团队组织</span>
                  </div>
                </button>
                <button onClick={() => handleScenarioSelect('pivot')}
                  className="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-all"
                  style={selectedScenario === 'pivot'
                    ? {background:'#f97316', color:'white'}
                    : {background:'transparent', color:'#9ca3af'}}>
                  <div className="flex items-center gap-2">
                    <span className="text-base">🔄</span>
                    <span className="text-xs">战略转型</span>
                  </div>
                </button>
              </div>
            </div>

            {/* 自定义 */}
            <div>
              <div className="text-xs font-semibold mb-2 px-2" style={{color:'#6b7280'}}>自定义</div>
              <div className="space-y-1">
                <button onClick={() => handleScenarioSelect('custom')}
                  className="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-all"
                  style={selectedScenario === 'custom'
                    ? {background:'#f97316', color:'white'}
                    : {background:'transparent', color:'#9ca3af'}}>
                  <div className="flex items-center gap-2">
                    <span className="text-base">💡</span>
                    <span className="text-xs">自定义问题</span>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Main Chat Area */}
      <div className="flex-1 flex flex-col w-full md:w-auto">
        {/* Header */}
        <div className="px-4 py-3 border-b" style={{background:'#1a1a1a',borderColor:'#2d2d2d'}}>
          <div className="max-w-4xl mx-auto">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <button onClick={() => setSidebarOpen(true)}
                  className="md:hidden w-8 h-8 rounded-lg flex items-center justify-center text-gray-400"
                  style={{background:'#2d2d2d'}}>☰</button>
                <div className="text-sm font-bold text-white">YC Office Hours</div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setAuto(a => !a)}
                  className="text-xs px-2 md:px-3 py-1.5 rounded-lg font-semibold transition-all"
                  style={autoPlay ? {background:'#f97316',color:'white'} : {background:'#2d2d2d',color:'#9ca3af'}}>
                  {autoPlay ? '⏸' : '▶'}
                </button>
                <button onClick={() => { setShown(conversation.length); setTyping(false); setAuto(false); }}
                  className="text-xs px-2 md:px-3 py-1.5 rounded-lg font-semibold"
                  style={{background:'#14532d',color:'#4ade80'}}>⚡</button>
              </div>
            </div>
            <PhaseBar current={currentPhase} phases={PHASES} />
          </div>
        </div>

        {/* Chat Messages */}
        <div ref={chatRef} className="chat-scroll flex-1 overflow-y-auto px-4 py-6">
          <div className="max-w-4xl mx-auto space-y-5">
            {shown === 0 && (
              <div className="text-center py-12" style={{color:'#6b7280'}}>
                <div className="text-4xl mb-3">💬</div>
                <div className="text-sm font-medium text-gray-400">点击"开始对话"体验完整的 YC Office Hours 流程</div>
                <div className="text-xs mt-1" style={{color:'#4b5563'}}>
                  场景：{SCENARIOS.find(s => s.id === selectedScenario)?.example}
                </div>
              </div>
            )}
            {conversation.slice(0, shown).map((msg, i) => <Bubble key={i} msg={msg} />)}
            {typing && (
              <div className="msg-in flex gap-3">
                <div className="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-black flex-shrink-0"
                  style={{background:'linear-gradient(135deg,#f97316,#ea580c)'}}>YC</div>
                <div className="rounded-2xl px-4 py-3 shadow" style={{background:'#1e1e1e',border:'1px solid #333',borderTopLeftRadius:'4px'}}>
                  <span className="typing text-xs" style={{color:'#f97316'}} />
                </div>
              </div>
            )}
            {done && (
              <div className="text-center py-6">
                <div className="text-xs mb-3" style={{color:'#4b5563'}}>── Office Hours 结束 · 共 {conversation.length} 轮对话 ──</div>
                <div className="inline-block rounded-xl p-4" style={{background:'#1a1a1a', border:'2px solid #f97316'}}>
                  <div className="text-sm font-bold text-white mb-2">🎉 完整诊断报告已生成</div>
                  <div className="text-xs text-gray-400">向上滚动查看完整报告，或点击"下载完整报告"保存</div>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Footer */}
        <div className="px-4 py-3 border-t" style={{background:'#1a1a1a',borderColor:'#2d2d2d'}}>
          <div className="max-w-4xl mx-auto flex items-center gap-3">
            {!done ? (
              <>
                <button onClick={advance} disabled={typing}
                  className="flex-1 py-3 rounded-xl font-bold text-sm transition-all"
                  style={typing ? {background:'#2d2d2d',color:'#4b5563',cursor:'not-allowed'} : {background:'linear-gradient(135deg,#f97316,#ea580c)',color:'white'}}>
                  {typing ? 'YC 合伙人正在思考...' : shown === 0 ? '🚀 开始对话' : conversation[shown]?.r === 'yc' ? '⬇ 下一条（YC）' : '⬇ 下一条（创始人）'}
                </button>
                <div className="text-xs flex-shrink-0" style={{color:'#4b5563'}}>{shown}/{conversation.length}</div>
              </>
            ) : (
              <button onClick={() => { setShown(0); setTyping(false); setAuto(false); }}
                className="flex-1 py-3 rounded-xl font-bold text-sm"
                style={{background:'#2d2d2d',color:'#9ca3af'}}>↺ 重新播放</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
