<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中远海特 · CIR智能情报系统</title>
<style>
:root {
  --cosco-blue: #00508F;
  --cosco-dark: #003366;
  --cosco-red: #D6000E;
  --cosco-light: #E8F2FA;
  --cosco-mid: #4A90C4;
  --bg: #F4F6F9;
  --card: #FFFFFF;
  --text: #1A2B3C;
  --muted: #6B7C93;
  --border: #D8E4EF;
  --success: #1A8A4A;
  --warn: #D4820A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; height: 100dvh; overflow: hidden; }

.app { display: flex; height: 100vh; height: 100dvh; }
.sidebar { width: 280px; background: linear-gradient(180deg, var(--cosco-dark) 0%, var(--cosco-blue) 100%); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.logo-bar { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.12); }
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 44px; height: 44px; flex-shrink: 0; }
.logo-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: .5px; line-height: 1.2; }
.logo-name em { color: #FFD700; font-style: normal; }
.logo-sub { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 3px; letter-spacing: 1px; }

.skill-list { padding: 16px 12px; flex: 1; }
.skill-label { font-size: 10px; color: rgba(255,255,255,.35); letter-spacing: 2px; padding: 0 8px; margin-bottom: 10px; }
.skill-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all .25s; margin-bottom: 6px; border: 1px solid transparent; }
.skill-item:hover { background: rgba(255,255,255,.1); }
.skill-item.active { background: rgba(255,255,255,.15); border-color: var(--cosco-red); }
.skill-icon-wrap { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .25s; }
.skill-item.active .skill-icon-wrap { background: var(--cosco-red); }
.skill-info { flex: 1; min-width: 0; }
.skill-name { color: #fff; font-size: 14px; font-weight: 600; }
.skill-cmd { color: rgba(255,255,255,.45); font-size: 11px; font-family: monospace; margin-top: 2px; }
.skill-item.active .skill-cmd { color: #FFD700; }
.skill-badge { background: var(--cosco-red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }

.chat-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.header-icon { width: 38px; height: 38px; border-radius: 8px; background: var(--cosco-blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.header-info { flex: 1; }
.header-title { font-size: 16px; font-weight: 700; color: var(--text); }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.header-status { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--success); white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth; }
.chat-body::-webkit-scrollbar { width: 4px; }
.chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { display: flex; gap: 10px; margin-bottom: 18px; animation: fadeUp .3s ease; }
.msg.user { flex-direction: row-reverse; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-size: 16px; }
.msg.ai .msg-avatar { background: var(--cosco-blue); }
.msg.user .msg-avatar { background: var(--cosco-dark); color: #fff; font-size: 13px; font-weight: 700; }
.msg-body { max-width: 78%; }
.msg.user .msg-body { align-items: flex-end; display: flex; flex-direction: column; }
.bubble { background: var(--card); border: 1px solid var(--border); border-radius: 14px; border-top-left-radius: 4px; padding: 12px 16px; font-size: 14px; line-height: 1.65; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.msg.user .bubble { background: var(--cosco-blue); color: #fff; border-color: var(--cosco-blue); border-top-right-radius: 4px; border-top-left-radius: 14px; }
.msg-time { font-size: 11px; color: var(--muted); margin-top: 5px; padding: 0 4px; }

.quick-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.qbtn { background: var(--cosco-light); border: 1px solid #B8D4EC; color: var(--cosco-blue); border-radius: 20px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
.qbtn:hover, .qbtn:active { background: var(--cosco-blue); color: #fff; border-color: var(--cosco-blue); }

.dcard { background: linear-gradient(135deg, #EBF4FF 0%, #F0F7FF 100%); border: 1px solid #B8D4EC; border-left: 3px solid var(--cosco-blue); border-radius: 10px; padding: 14px; margin-top: 12px; }
.dcard.red { border-left-color: var(--cosco-red); background: linear-gradient(135deg, #FFF5F5 0%, #FFF0F0 100%); border-color: #F5C0C0; }
.dcard.gold { border-left-color: #D4820A; background: linear-gradient(135deg, #FFFBF0 0%, #FFF8E8 100%); border-color: #F0D890; }
.dcard-title { font-size: 13px; font-weight: 700; color: var(--cosco-dark); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.drow { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(0,80,143,.1); }
.drow:last-child { border-bottom: none; }
.dlabel { color: var(--muted); font-size: 13px; }
.dval { font-weight: 700; font-size: 13px; }
.dval.red { color: var(--cosco-red); }
.dval.blue { color: var(--cosco-blue); }
.dval.green { color: var(--success); }
.dval.warn { color: var(--warn); }
.dval.gold { color: #B8860B; }

.signal-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(0,80,143,.1); }
.signal-row:last-child { border-bottom: none; }
.sdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.sdot.high { background: var(--cosco-red); box-shadow: 0 0 0 3px rgba(214,0,14,.15); }
.sdot.mid { background: var(--warn); box-shadow: 0 0 0 3px rgba(212,130,10,.15); }
.sdot.low { background: var(--cosco-mid); box-shadow: 0 0 0 3px rgba(74,144,196,.15); }
.signal-info { flex: 1; }
.signal-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.signal-meta { font-size: 11px; color: var(--muted); }
.signal-score { font-size: 15px; font-weight: 700; color: var(--cosco-blue); flex-shrink: 0; }

.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin: 2px 3px 2px 0; }
.tag-red { background: #FDECEA; color: var(--cosco-red); }
.tag-blue { background: var(--cosco-light); color: var(--cosco-blue); }
.tag-gold { background: #FFF8E1; color: #B8860B; }
.tag-green { background: #E8F5E9; color: var(--success); }

.action-box { background: #FFFBF0; border: 1px solid #FFD700; border-radius: 10px; padding: 14px; margin-top: 12px; }
.action-box-title { font-size: 12px; font-weight: 700; color: #B8860B; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.action-box p { font-size: 13px; line-height: 1.9; color: var(--text); }

.step-list { margin-top: 10px; }
.step { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(0,80,143,.08); }
.step:last-child { border-bottom: none; }
.step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--cosco-blue); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.step-text { flex: 1; font-size: 13px; line-height: 1.5; color: var(--text); }
.step-time { font-size: 11px; color: var(--cosco-red); font-weight: 600; white-space: nowrap; }

.typing-wrap { display: flex; gap: 5px; padding: 4px 2px; }
.typing-wrap span { width: 7px; height: 7px; border-radius: 50%; background: var(--cosco-mid); animation: typing 1.4s infinite; }
.typing-wrap span:nth-child(2) { animation-delay: .2s; }
.typing-wrap span:nth-child(3) { animation-delay: .4s; }
@keyframes typing { 0%,60%,100%{opacity:.3;transform:scale(1)} 30%{opacity:1;transform:scale(1.2)} }

.chat-input { background: var(--card); border-top: 1px solid var(--border); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; flex-shrink: 0; }
.input-field { flex: 1; border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 14px; outline: none; background: var(--bg); transition: border-color .2s; font-family: inherit; }
.input-field:focus { border-color: var(--cosco-blue); background: #fff; }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--cosco-blue); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s; }
.send-btn:hover { background: var(--cosco-dark); }
.send-btn:active { transform: scale(.95); }

.mobile-tabs { display: none; background: var(--cosco-dark); border-top: 2px solid var(--cosco-red); padding-bottom: env(safe-area-inset-bottom); }
.tab-list { display: flex; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 8px; cursor: pointer; transition: all .2s; border-top: 2px solid transparent; margin-top: -2px; }
.tab-item.active { border-top-color: #FFD700; }
.tab-label { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 600; }
.tab-item.active .tab-label { color: #FFD700; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-tabs { display: block; }
  /* 输入区不再处理 safe-area（底部 tab 已处理）*/
  .chat-input { padding: 10px 12px 10px; }
  .chat-body { padding: 12px 10px; -webkit-overflow-scrolling: touch; }
  .chat-header { padding: 10px 14px; gap: 10px; }
  .header-icon { width: 32px; height: 32px; }
  .header-title { font-size: 14px; }
  .header-sub { font-size: 11px; display: none; }
  .header-status { font-size: 11px; }
  .msg-body { max-width: 90%; }
  .bubble { font-size: 13px; padding: 10px 13px; }
  .msg-avatar { width: 30px; height: 30px; font-size: 14px; }
  .dcard { padding: 12px 12px 8px; }
  .dcard-title { font-size: 12px; margin-bottom: 8px; }
  .drow { padding: 5px 0; }
  .dlabel { font-size: 12px; }
  .dval { font-size: 12px; }
  .signal-name { font-size: 12px; }
  .signal-meta { font-size: 11px; }
  .signal-score { font-size: 14px; }
  .action-box { padding: 12px; }
  .action-box p { font-size: 12px; line-height: 1.7; }
  .step-text { font-size: 12px; }
  .qbtn { font-size: 11px; padding: 6px 11px; }
  .input-field { font-size: 16px; /* 防止iOS自动缩放 */ padding: 9px 14px; }
  .send-btn { width: 38px; height: 38px; }
}
@media (min-width: 769px) { .mobile-tabs { display: none; } }
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo-bar">
    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 深蓝底 -->
        <rect width="44" height="44" rx="8" fill="#003F8A"/>
        <!-- 地球轮廓 + 经纬网 -->
        <circle cx="20" cy="22" r="12.5" stroke="rgba(255,255,255,0.22)" stroke-width="0.9" fill="none"/>
        <line x1="7.5" y1="22" x2="32.5" y2="22" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
        <line x1="20" y1="9.5" x2="20" y2="34.5" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
        <!-- 3条波浪纬线（COSCO标志核心元素）-->
        <path d="M7.5 16.5 C10.5 14 13.5 19 18 16.5 C22.5 14 26.5 19 31 16.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M7.5 22 C10.5 19.5 13.5 24.5 18 22 C22.5 19.5 26.5 24.5 31 22" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M7.5 27.5 C10.5 25 13.5 30 18 27.5 C22.5 25 26.5 30 31 27.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- 船首三角（从右侧切入的实心白色三角）-->
        <path d="M30 12.5 L44 22 L30 22 Z" fill="white"/>
      </svg>
      <div>
        <div class="logo-name">中远海特 <em>CIR</em></div>
        <div class="logo-sub">智能情报雷达系统</div>
      </div>
    </div>
  </div>

  <div class="skill-list">
    <div class="skill-label">虚拟员工 · SKILLS</div>

    <div class="skill-item active" id="sb-radar" onclick="switchSkill('radar')">
      <div class="skill-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="5" stroke="white" stroke-width="1.5" opacity=".5"/><circle cx="11" cy="11" r="2" fill="white"/><line x1="11" y1="2" x2="11" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="17" x2="11" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="11" x2="5" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="17" y1="11" x2="20" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="17" y2="6" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="skill-info"><div class="skill-name">雷达站</div><div class="skill-cmd">/radar · 信号监控</div></div>
      <div class="skill-badge">7</div>
    </div>

    <div class="skill-item" id="sb-chart" onclick="switchSkill('chart')">
      <div class="skill-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="white" stroke-width="1.5"/><line x1="11" y1="3" x2="11" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="16" y2="15" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="1.5" fill="white"/><line x1="3" y1="11" x2="19" y2="11" stroke="white" stroke-width="1" opacity=".3"/><line x1="11" y1="3" x2="11" y2="19" stroke="white" stroke-width="1" opacity=".3"/></svg>
      </div>
      <div class="skill-info"><div class="skill-name">海图室</div><div class="skill-cmd">/chart · 情报分析</div></div>
    </div>

    <div class="skill-item" id="sb-lookout" onclick="switchSkill('lookout')">
      <div class="skill-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="8" cy="10" r="5" stroke="white" stroke-width="1.5"/><line x1="12" y1="14" x2="19" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="8" cy="10" r="2" fill="#FFD700" opacity=".9"/></svg>
      </div>
      <div class="skill-info"><div class="skill-name">瞭望台</div><div class="skill-cmd">/lookout · 商机预警</div></div>
      <div class="skill-badge">3</div>
    </div>

    <div class="skill-item" id="sb-log" onclick="switchSkill('log')">
      <div class="skill-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="4" y="2" width="14" height="18" rx="2" stroke="white" stroke-width="1.5"/><line x1="7" y1="7" x2="15" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="11" x2="15" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="15" x2="11" y2="15" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="skill-info"><div class="skill-name">航海日志</div><div class="skill-cmd">/log · 报告生成</div></div>
    </div>

    <div class="skill-item" id="sb-nav" onclick="switchSkill('nav')">
      <div class="skill-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="3" stroke="white" stroke-width="1.5"/><line x1="11" y1="2" x2="11" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="14" x2="11" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="11" x2="8" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="14" y1="11" x2="20" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="11" r="1.5" fill="#FFD700"/></svg>
      </div>
      <div class="skill-info"><div class="skill-name">领航员</div><div class="skill-cmd">/nav · 跟进指引</div></div>
    </div>
  </div>
</div>

<!-- CHAT AREA -->
<div class="chat-area">
  <div class="chat-header">
    <div class="header-icon" id="hdrIcon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="5" stroke="white" stroke-width="1.5" opacity=".5"/><circle cx="11" cy="11" r="2" fill="white"/><line x1="11" y1="11" x2="17" y2="6" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="header-info">
      <div class="header-title" id="hdrTitle">雷达站</div>
      <div class="header-sub" id="hdrSub">实时监控客户动态信号 · 智能去重分类</div>
    </div>
    <div class="header-status"><div class="status-dot"></div>运行中</div>
  </div>

  <div class="chat-body" id="chatBody"></div>

  <div class="chat-input">
    <input type="text" class="input-field" id="userInput" placeholder="向虚拟员工提问..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M16 9L2 2l3 7-3 7 14-7z" fill="white"/></svg>
    </button>
  </div>

<!-- MOBILE BOTTOM TABS -->
<div class="mobile-tabs">
  <div class="tab-list">
    <div class="tab-item active" id="tab-radar" onclick="switchSkill('radar')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="5" stroke="white" stroke-width="1.5" opacity=".4"/><circle cx="11" cy="11" r="2" fill="white"/><line x1="11" y1="11" x2="17" y2="6" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="tab-label">雷达站</span>
    </div>
    <div class="tab-item" id="tab-chart" onclick="switchSkill('chart')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="white" stroke-width="1.5"/><line x1="11" y1="3" x2="11" y2="11" stroke="white" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="11" x2="16" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="1.5" fill="white"/></svg>
      <span class="tab-label">海图室</span>
    </div>
    <div class="tab-item" id="tab-lookout" onclick="switchSkill('lookout')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="8" cy="10" r="5" stroke="white" stroke-width="1.5"/><line x1="12" y1="14" x2="19" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/><circle cx="8" cy="10" r="2" fill="white" opacity=".8"/></svg>
      <span class="tab-label">瞭望台</span>

function defaultResp(skill) {

    chart:   '请告诉我需要分析的方向（竞品、行业趋势、客户画像或运价情报），我为您深度解析。',
    lookout: '请输入客户名称，我为您生成商机评估报告和建议行动。',
    log:     '请告诉我需要生成的报告类型（日报/周报/月报/商机简报），我立即为您生成。',
    nav:     '请告诉我要跟进的客户名称，我为您生成个性化话术和行动建议。'
  };
  return `<p>${d[skill] || d.radar}</p>`;
}

function getResponse(skill, text) {
  const t = text;
  // 雷达站
  if (t.includes('高优') || t.includes('高价值')) return resp_radarHigh();
  if (t.includes('远景') && (t.includes('详情') || t.includes('动态') || t.includes('信号') || skill==='radar')) return resp_yuanjing();
  if (t.includes('宁德') && (t.includes('动态') || t.includes('详情') || t.includes('信号') || skill==='radar')) return resp_ningde();
  // 海图室
  if (t.includes('竞品') || t.includes('竞争')) return resp_competitor();
  if (t.includes('趋势') || t.includes('行业')) return resp_trend();
  if (t.includes('画像')) return resp_ningdeProfile();
  if (t.includes('价格') || t.includes('运价')) return resp_price();
  // 瞭望台
  if (t.includes('远景') && t.includes('商机')) return resp_lookoutDetail('远景能源内蒙古项目','92','8,000 CBM（首批）','仅剩 7 天','风电叶片、轮毂、机舱罩','约 1,400 万元',
    '<div class="step"><div class="step-num">1</div><div class="step-text">今日致电王总，确认设备发运计划</div><div class="step-time">今日</div></div><div class="step"><div class="step-num">2</div><div class="step-text">提交内蒙古→出口港公路段方案报价</div><div class="step-time">明日</div></div><div class="step"><div class="step-num">3</div><div class="step-text">锁定7月特种船舱位</div><div class="step-time">本周内</div></div>');
  if (t.includes('宁德') && t.includes('商机')) return resp_lookoutDetail('宁德时代匈牙利二期','88','12,000 CBM','14 天','生产线设备、变压器、储能模组','约 2,200 万元',
    '<div class="step"><div class="step-num">1</div><div class="step-text">发送海特欧洲专线+重件方案PPT</div><div class="step-time">今日</div></div><div class="step"><div class="step-num">2</div><div class="step-text">安排与李总视频会议</div><div class="step-time">本周</div></div><div class="step"><div class="step-num">3</div><div class="step-text">提交正式报价</div><div class="step-time">14天内</div></div>');
  if (t.includes('三一') && t.includes('商机')) return resp_lookoutDetail('三一重工沙特EPC','79','3,500 CBM','21 天','重型工程机械、泵车、起重设备','约 600 万元',
    '<div class="step"><div class="step-num">1</div><div class="step-text">联系采购部门确认货物清单</div><div class="step-time">本周</div></div><div class="step"><div class="step-num">2</div><div class="step-text">提交中东线报价</div><div class="step-time">21天内</div></div>');
  // 航海日志
  if (t.includes('日报') || t.includes('今日')) return resp_logDaily();
  if (t.includes('周报') || t.includes('本周')) return resp_logWeekly();
  if (t.includes('月报') || t.includes('本月')) return resp_logMonthly();
  if (t.includes('商机简报') || t.includes('简报')) return resp_logOpp();
  // 领航员
  if (t.includes('远景') && (t.includes('话术') || t.includes('跟进'))) return resp_navYuanjing();
  if (t.includes('宁德') && (t.includes('方案') || t.includes('话术'))) return resp_navNingde();
  if (t.includes('三一') && (t.includes('报价') || t.includes('策略'))) return resp_navSany();
  // 兜底
  return defaultResp(skill);
}

// ── UI helpers ────────────────────────────────────────────────────────────────
const AI_AVATAR = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" fill="rgba(255,255,255,.2)"/><circle cx="9" cy="9" r="4" fill="none" stroke="white" stroke-width="1.2"/><circle cx="9" cy="9" r="1.5" fill="white"/><line x1="9" y1="2" x2="9" y2="5" stroke="white" stroke-width="1.2" stroke-linecap="round"/><line x1="9" y1="13" x2="9" y2="16" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>`;

function nowTime() {
  return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMsg(html, isUser) {
  const body = document.getElementById('chatBody');
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'ai');
  const avatar = isUser
    ? `<div class="msg-avatar">王</div>`
    : `<div class="msg-avatar">${AI_AVATAR}</div>`;
  div.innerHTML = `${avatar}<div class="msg-body"><div class="bubble">${isUser ? escHtml(html) : html}</div><div class="msg-time">${nowTime()}</div></div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function showTyping() {
  const body = document.getElementById('chatBody');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing-ind';
  div.innerHTML = `<div class="msg-avatar">${AI_AVATAR}</div><div class="msg-body"><div class="bubble"><div class="typing-wrap"><span></span><span></span><span></span></div></div></div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function hideTyping() { const e = document.getElementById('typing-ind'); if(e) e.remove(); }

function clickQuick(text) {
  document.getElementById('userInput').value = text;
  sendMsg();
}

function sendMsg() {
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();
  if (!text) return;
  addMsg(text, true);
  inp.value = '';
  showTyping();
  setTimeout(() => { hideTyping(); addMsg(getResponse(currentSkill, text), false); }, 900 + Math.random()*500);
}

function switchSkill(skill) {
  if (!SKILLS[skill]) return;
  currentSkill = skill;
  document.querySelectorAll('.skill-item').forEach(e => e.classList.remove('active'));
  const sb = document.getElementById('sb-'+skill); if(sb) sb.classList.add('active');
  document.querySelectorAll('.tab-item').forEach(e => e.classList.remove('active'));
  const tab = document.getElementById('tab-'+skill); if(tab) tab.classList.add('active');
  const cfg = SKILLS[skill];
  document.getElementById('hdrTitle').textContent = cfg.title;
  document.getElementById('hdrSub').textContent = cfg.sub;
  document.getElementById('hdrIcon').innerHTML = cfg.icon;
  const body = document.getElementById('chatBody');
  body.innerHTML = '';
  addMsg(getWelcome(skill), false);
}

window.addEventListener('DOMContentLoaded', () => {
  switchSkill('radar');
  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
});
</script>
