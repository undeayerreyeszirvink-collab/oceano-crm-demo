<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧神诺AI-Native CRM - Skills全景演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        .slide-in { animation: slideIn 0.4s ease-out; }
        .pulse-slow { animation: pulse 2s ease-in-out infinite; }
        .skill-card { transition: all 0.3s ease; }
        .skill-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .skill-card.active { border-width: 3px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .chat-bubble { max-width: 80%; word-wrap: break-word; }
        .typing-indicator span { animation: pulse 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
                    <span class="text-2xl">🤖</span>
                </div>
                <div>
                    <h1 class="text-xl font-semibold">欧神诺AI-Native CRM</h1>
                    <p class="text-xs text-slate-400">AI Agent驱动的全场景Skills系统</p>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="mb-8 fade-in">
            <h2 class="text-2xl font-bold mb-2">🎯 AI Skills 全景架构</h2>
            <p class="text-slate-400 mb-6">将传统CRM功能转化为AI Agent驱动的智能Skills</p>

            <div class="bg-slate-900 rounded-xl p-6 border border-slate-800">
                <div class="grid grid-cols-5 gap-4">
                    <div id="card-market" onclick="showSkill('market')" class="skill-card cursor-pointer bg-gradient-to-br from-blue-900 to-blue-800 rounded-lg p-4 border border-blue-700 active">
                        <div class="text-3xl mb-2">📢</div>
                        <h3 class="font-semibold mb-1">市场运营</h3>
                        <p class="text-xs text-slate-300">/market-ops</p>
                    </div>
                    <div id="card-sales" onclick="showSkill('sales')" class="skill-card cursor-pointer bg-gradient-to-br from-green-900 to-green-800 rounded-lg p-4 border border-green-700">
                        <div class="text-3xl mb-2">💼</div>
                        <h3 class="font-semibold mb-1">销售运营</h3>
                        <p class="text-xs text-slate-300">/sales-ops</p>
                    </div>
                    <div id="card-dealer" onclick="showSkill('dealer')" class="skill-card cursor-pointer bg-gradient-to-br from-purple-900 to-purple-800 rounded-lg p-4 border border-purple-700">
                        <div class="text-3xl mb-2">🏪</div>
                        <h3 class="font-semibold mb-1">经销商运营</h3>
                        <p class="text-xs text-slate-300">/dealer-ops</p>
                    </div>
                    <div id="card-service" onclick="showSkill('service')" class="skill-card cursor-pointer bg-gradient-to-br from-amber-900 to-amber-800 rounded-lg p-4 border border-amber-700">
                        <div class="text-3xl mb-2">🛠️</div>
                        <h3 class="font-semibold mb-1">服务运营</h3>
                        <p class="text-xs text-slate-300">/service-ops</p>
                    </div>
                    <div id="card-project" onclick="showSkill('project')" class="skill-card cursor-pointer bg-gradient-to-br from-red-900 to-red-800 rounded-lg p-4 border border-red-700">
                        <div class="text-3xl mb-2">🎯</div>
                        <h3 class="font-semibold mb-1">项目运营</h3>
                        <p class="text-xs text-slate-300">/project-ops</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="skill-detail" class="space-y-6"></div>
    </div>

    <script>
        const skillsData = {
            market: {
                name: '市场运营 Skill',
                icon: '📢',
                description: '智能管理市场活动、销售线索、网络留言，AI自动分析转化效果',
                capabilities: [
                    { name: '线索智能分析', icon: '🔍', desc: 'AI评估线索质量，智能画像生成，ROI分析' },
                    { name: '活动效果预警', icon: '⚠️', desc: '活动进度监控，预算超支预警，ROI异常检测' },
                    { name: '转化策略建议', icon: '💡', desc: 'AI生成跟进话术，最佳联系时间推荐' },
                    { name: '行动自动追踪', icon: '✅', desc: '任务自动创建，未跟进提醒，漏斗追踪' }
                ]
            },
            sales: {
                name: '销售运营 Skill',
                icon: '💼',
                description: '智能管理销售全流程，从商机挖掘到成交回款，AI全程辅助',
                capabilities: [
                    { name: '商机智能分析', icon: '🎯', desc: '商机自动评分，成交概率预测，竞争态势分析' },
                    { name: '销售进度预警', icon: '⚠️', desc: '商机停滞预警，关键节点提醒，流失风险预测' },
                    { name: '跟进策略建议', icon: '💡', desc: 'AI生成跟进话术，拜访时机推荐，谈判策略' },
                    { name: '销售全程追踪', icon: '📊', desc: '销售漏斗可视化，转化率分析，目标达成追踪' }
                ]
            },
            dealer: {
                name: '经销商运营 Skill',
                icon: '🏪',
                description: '智能管理经销商全生命周期，从招商到日常运营，AI全方位赋能',
                capabilities: [
                    { name: '经营数据分析', icon: '📊', desc: '销售数据分析，库存周转监控，回款状态追踪' },
                    { name: '异常智能预警', icon: '⚠️', desc: '销量下滑预警，库存积压提醒，回款逾期预警' },
                    { name: '政策智能建议', icon: '💡', desc: '补货计划生成，促销方案推荐，信用额度调整' },
                    { name: '运营行动追踪', icon: '✅', desc: '拜访计划安排，政策执行追踪，培训任务监控' }
                ]
            },
            service: {
                name: '服务运营 Skill',
                icon: '🛠️',
                description: '智能管理售后服务全流程，提升客户满意度，降低服务成本',
                capabilities: [
                    { name: '工单智能分析', icon: '📋', desc: '工单自动分类，响应时效分析，问题根因识别' },
                    { name: '服务质量预警', icon: '⚠️', desc: '响应超时预警，投诉升级提醒，满意度异常检测' },
                    { name: '服务优化建议', icon: '💡', desc: 'AI生成解决方案，流程优化建议，知识库推荐' },
                    { name: '服务全程追踪', icon: '✅', desc: '工单状态追踪，人员绩效分析，回访自动提醒' }
                ]
            },
            project: {
                name: '项目运营 Skill',
                icon: '🎯',
                description: '智能管理工程项目全生命周期，从立项到交付，AI全程风险管控',
                capabilities: [
                    { name: '项目智能分析', icon: '📊', desc: '进度实时追踪，成本收益分析，资源利用监控' },
                    { name: '风险智能预警', icon: '⚠️', desc: '进度延期预警，成本超支提醒，质量问题识别' },
                    { name: '资源优化建议', icon: '💡', desc: '人员调配建议，材料采购优化，施工计划调整' },
                    { name: '项目全程追踪', icon: '✅', desc: '里程碑监控，变更管理追踪，验收标准检查' }
                ]
            }
        };

        function showSkill(skillKey) {
            const skill = skillsData[skillKey];
            const detail = document.getElementById('skill-detail');

            let html = `
                <div class="fade-in">
                    <div class="bg-slate-900 rounded-xl p-6 border border-slate-800 mb-6">
                        <div class="flex items-center space-x-3">
                            <div class="text-4xl">${skill.icon}</div>
                            <div>
                                <h2 class="text-2xl font-bold">${skill.name}</h2>
                                <p class="text-slate-400">${skill.description}</p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
            `;

            skill.capabilities.forEach((cap, i) => {
                html += `
                    <div class="bg-slate-900 rounded-xl p-6 border border-slate-800 slide-in" style="animation-delay: ${i * 0.1}s">
                        <div class="flex items-center space-x-2 mb-3">
                            <span class="text-2xl">${cap.icon}</span>
                            <h3 class="text-lg font-semibold">${cap.name}</h3>
                        </div>
                        <p class="text-sm text-slate-300">${cap.desc}</p>
                    </div>
                `;
            });

            html += '</div></div>';
            detail.innerHTML = html;
        }

        window.onload = () => showSkill('market');
    </script>
</body>
</html>
