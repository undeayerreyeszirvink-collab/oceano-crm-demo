Claude Code 提示词：欧神诺 SFA 数字化作战平台演练 DEMO
Role: 你是一位资深的 React 全栈工程师和增长产品经理。
Project: 为“欧神诺（Oceano）陶瓷”构建一个 CRM/SFA 顶层设计演示原型。

1. 核心战略纲领（核心原则）
这个 DEMO 的目的是向销售一线证明“系统是副官”，向管理层证明“数据是资产”。

零感知采集 (Zero-Friction Capture)： 销售不应手写录入。通讯、文档阅读、报价行为即数据。

利益强绑定 (Profit Locking)： CRM = 提成保护池。无记录=无归属=无提成。

AI 作战副官： 减少表格录入成本，帮助销售“少干活”。 表格是这样的：

2. 技术栈要求
React (Functional Components), Tailwind CSS, Lucide-React 图标库。

具备流畅的交互动画（Animate.css 或 Tailwind 原生动画）。

3. 核心功能模块设计
A. 顶层设计架构页 (Architecture View)

展示“输入 -> 引擎 -> 输出”逻辑。

输入端： 语音转结构化、扫码建档、报价单识别、AI 拍照盘点、文档追踪。

引擎端： 利益分配算法（提成保护期锁定、公海流转预警）。

输出端（管理 4 大指标）： 客户资产沉淀率、销售有效动作率、客户生命周期价值(CLV)、团队跟进质量评分。

B. SFA 移动端演练沙盘 (Mobile Demo)

模拟一个高保真 iPhone 容器。

场景 1：AI 拍照自动盘点。 模拟点击拍照，AI 自动扫描（带扫描线条动画），直接出结果：店面面积、中国玉陈列率、竞品渗透率（对标梁倚萌 Excel 维度）。

场景 2：语音作战助手。 点击麦克风，模拟录音波纹，自动提取结构化商机（客户痛点、意向等级、待办任务）。

场景 3：意向温度计。 展示“不问即知”的逻辑：通过追踪微信图册阅读行为（时长/频率）自动升温，并在 UI 显著标记。

场景 4：资产保护区。 突出显示“提成锁定”状态，用倒计时和利益诱导（而非行政命令）驱动销售更新数据。

C. 华中运营中心盘点页 (Admin Analysis)

数据硬核背景： 基于 24 年 1-5 月数据（总业绩 1.11 亿，同比 -18.8%）。

维度： 零售 (-23.3%) vs 工程 (+57.4%) 的结构性差异。

画像分析： 还原梁倚萌 Excel 中的：夫妻店占比 (70%)、多品牌经营占比 (74%)、二代接班率 (15%)。

预警名单： 展示周口、合肥、襄阳同盟的重点经销商质量评分与核心痛点批注。

4. UI/UX 风格
配色： 深邃蓝 (#0F172A) 作为背景，智慧蓝 (#2563EB) 和荧光绿 (#10B981) 作为交互点。

交互逻辑： 这是一个“路演模式”。界面右侧应有一个固定悬浮的“演示提词器”，引导操作者按步骤点击演示。

5. 初始任务
请先生成这个系统的顶层框架代码，重点优化 SFA 移动端的“AI 拍照盘点”交互效果。