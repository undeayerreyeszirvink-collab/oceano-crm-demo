<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧神诺 SFA 数字化作战平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#0F172A',
                        'smart-blue': '#2563EB',
                        'neon-green': '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        @keyframes pulse-wave {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10B981, transparent);
            animation: scan 2s ease-in-out infinite;
            box-shadow: 0 0 10px #10B981;
        }
        .pulse-ring {
            animation: pulse-wave 1.5s ease-out infinite;
        }
        .fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-deep-blue text-white font-sans overflow-x-hidden">

    <!-- 演示提词器 -->
    <div id="prompter" class="fixed right-4 top-20 w-80 bg-gray-800/90 backdrop-blur-sm rounded-lg p-4 shadow-2xl z-50 border border-smart-blue/30">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-neon-green">📋 演示提词器</h3>
            <button onclick="togglePrompter()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        <div id="prompter-content" class="text-xs space-y-2 text-gray-300">
            <div class="step active p-2 bg-smart-blue/20 rounded border-l-2 border-neon-green">
                <span class="font-semibold">步骤 1:</span> 点击顶部导航切换模块
            </div>
            <div class="step p-2 bg-gray-700/30 rounded">
                <span class="font-semibold">步骤 2:</span> 在移动端演示中点击"拍照盘点"
            </div>
            <div class="step p-2 bg-gray-700/30 rounded">
                <span class="font-semibold">步骤 3:</span> 观察AI扫描动画效果
            </div>
