<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作战地图宽表拆解</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#070c14; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.fade-up { animation:fadeUp .25s ease-out forwards }
::-webkit-scrollbar { width:4px; height:4px }
::-webkit-scrollbar-thumb { background:#1a2a3a; border-radius:2px }

.col-cell {
  width:14px; height:36px; border-radius:3px; flex-shrink:0; cursor:pointer;
  transition:transform .1s, box-shadow .1s; position:relative;
}
.col-cell:hover { transform:scaleY(1.3) scaleX(1.2); z-index:10; }
.col-cell.selected { transform:scaleY(1.4) scaleX(1.3); z-index:20; box-shadow:0 0 0 2px white; }

/* 字段列表面板 */
.field-list-panel {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  max-height: 200px;
  overflow-y: auto;
}

.field-item {
  padding: 6px 10px;
  margin: 3px 0;
  background: rgba(255,255,255,.02);
  border-radius: 4px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.15s;
}

.field-item:hover {
  background: rgba(255,255,255,.05);
  transform: translateX(3px);
}

.field-item-num {
  color: #64748b;
  font-family: monospace;
  min-width: 30px;
}

.field-item-name {
  color: #cbd5e1;
  flex: 1;
}

.field-list-panel::-webkit-scrollbar {
  width: 4px;
}

.field-list-panel::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 2px;
}

/* 6 data sources */
.src-auto    { background:#1d4ed8 }  /* 系统自动 blue */
.src-history { background:#047857 }  /* CRM历史 green */
.src-zero    { background:#7c3aed }  /* 零感知 purple */
.src-ai      { background:#b45309 }  /* AI确认 amber */
.src-voice   { background:#0e7490 }  /* 语音转化 cyan */
.src-human   { background:#b91c1c }  /* 人工判断 red */
.src-calc    { background:#374151 }  /* 自动计算 gray */

.src-auto:hover    { background:#2563eb }
.src-history:hover { background:#059669 }
.src-zero:hover    { background:#8b5cf6 }
.src-ai:hover      { background:#d97706 }
.src-voice:hover   { background:#0891b2 }
.src-human:hover   { background:#dc2626 }
.src-calc:hover    { background:#4b5563 }

.legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0 }

.detail-panel { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:14px }

.stat-num { font-size:28px; font-weight:800; line-height:1 }

/* section label */
.section-label { font-size:9px; color:#475569; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body class="text-slate-300 min-h-screen">

<!-- 顶栏 -->
<div class="px-6 py-4 border-b border-slate-900 flex items-center justify-between" style="background:#060c16">
  <div>
    <div class="font-bold text-white">华南2026经销商作战地图 · 155列宽表拆解</div>
    <div class="text-xs text-slate-500 mt-0.5">每一列都有它该来的地方。真正需要人打字的，不超过20列。</div>
  </div>
  <div class="text-xs text-slate-600">点击任意色块查看该列的详情与采集方式</div>
</div>

<!-- 统计行 -->
<div class="px-6 py-4 grid grid-cols-7 gap-3 border-b border-slate-900" style="background:#060c16">
  <div id="stat-auto"    class="text-center" title="点击筛选：系统自动拉取"></div>
  <div id="stat-history" class="text-center" title="点击筛选：CRM历史沉淀"></div>
  <div id="stat-zero"    class="text-center" title="点击筛选：零感知采集"></div>
  <div id="stat-voice"   class="text-center" title="点击筛选：语音转结构化"></div>
  <div id="stat-ai"      class="text-center" title="点击筛选：AI建议确认"></div>
  <div id="stat-calc"    class="text-center" title="点击筛选：自动计算"></div>
  <div id="stat-human"   class="text-center" title="点击筛选：人工判断"></div>
</div>

<!-- 图例 -->
<div class="px-6 py-3 flex flex-wrap gap-4 border-b border-slate-900" style="background:#060c16">
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('auto')"   id="leg-auto">   <div class="legend-dot src-auto"></div>   <span class="text-xs text-slate-400">系统自动拉取</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('history')" id="leg-history"><div class="legend-dot src-history"></div><span class="text-xs text-slate-400">CRM历史沉淀</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('zero')"   id="leg-zero">   <div class="legend-dot src-zero"></div>   <span class="text-xs text-slate-400">零感知采集（拍照）</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('voice')"  id="leg-voice">  <div class="legend-dot src-voice"></div>  <span class="text-xs text-slate-400">语音转结构化</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('ai')"     id="leg-ai">     <div class="legend-dot src-ai"></div>     <span class="text-xs text-slate-400">AI建议确认（点选）</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('calc')"   id="leg-calc">   <div class="legend-dot src-calc"></div>   <span class="text-xs text-slate-400">自动计算</span></div>
  <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterSource('human')"  id="leg-human">  <div class="legend-dot src-human"></div>  <span class="text-xs text-slate-400">人工判断（策略）</span></div>
  <button onclick="filterSource('all')" class="text-xs text-slate-600 hover:text-slate-400 ml-2">全部显示</button>
</div>

<div class="flex" style="height:calc(100vh - 200px)">

  <!-- 左：宽表可视化 -->
  <div class="flex-1 overflow-y-auto px-6 py-5">

    <!-- 宽表色块 -->
    <div id="col-grid" class="flex flex-wrap gap-1 mb-6">
      <!-- rendered by JS -->
    </div>

    <!-- 底部：每个大模块说明 -->
    <div id="section-summary" class="space-y-2">
      <!-- rendered by JS -->
    </div>

  </div>

  <!-- 右：点击详情 -->
  <div class="w-80 border-l border-slate-900 overflow-y-auto p-4 flex-shrink-0" style="background:#060c16">
    <div id="detail-default" class="text-center pt-12 text-slate-600">
      <div class="text-3xl mb-3">👆</div>
      <div class="text-sm">点击任意色块<br>查看该列详情</div>
    </div>
    <div id="detail-content" class="hidden fade-up">
      <div class="text-xs text-slate-600 mb-2" id="d-colnum"></div>
      <div class="font-bold text-white text-sm mb-1" id="d-name"></div>
      <div class="text-xs text-slate-500 mb-4" id="d-section"></div>

      <div class="flex items-center gap-2 mb-4">
        <div class="legend-dot" id="d-dot"></div>
        <div class="font-semibold text-sm" id="d-src-label"></div>
      </div>

      <div class="detail-panel p-4 mb-4">
        <div class="text-xs text-slate-500 mb-2 font-semibold uppercase tracking-wider">采集方式</div>
        <div class="text-sm text-slate-300 leading-relaxed" id="d-how"></div>
      </div>

      <div class="detail-panel p-4 mb-4">
        <div class="text-xs text-slate-500 mb-2 font-semibold uppercase tracking-wider">实际示例</div>
        <div class="text-sm text-slate-400 italic leading-relaxed font-mono" id="d-example"></div>
      </div>

      <div class="detail-panel p-4">
        <div class="text-xs text-slate-500 mb-2 font-semibold uppercase tracking-wider">业务员需要做什么</div>
        <div class="text-sm leading-relaxed" id="d-action"></div>
      </div>
    </div>
  </div>

</div>

// ══════════════════════════════════════
// 数据源配置
// ══════════════════════════════════════
const SRC_CONFIG = {
  auto:    { label:'系统自动拉取', icon:'🔵', cls:'src-auto',    note:'直连BIP/ERP/DMS，实时同步，0人工' },
  history: { label:'CRM历史沉淀', icon:'🟢', cls:'src-history',  note:'一次录入，永久复用，后续自动更新' },
  zero:    { label:'零感知采集',  icon:'🟣', cls:'src-zero',     note:'拍照AI识别，业务员0打字' },
  voice:   { label:'语音转结构化',icon:'🔵', cls:'src-voice',    note:'说一句话，AI提取并填入对应字段' },
  ai:      { label:'AI建议确认', icon:'🟡', cls:'src-ai',       note:'AI自动生成3个建议，点选一条即可' },
  calc:    { label:'自动计算',   icon:'⚫', cls:'src-calc',     note:'系统根据其他字段推算，0人工' },
  human:   { label:'人工判断',   icon:'🔴', cls:'src-human',    note:'真正需要动脑的策略决策，数量极少' },
};

// ══════════════════════════════════════
// 渲染色块
// ══════════════════════════════════════
let activeFilter = 'all';
let selectedCol = null;

function renderGrid(filter) {
  const grid = document.getElementById('col-grid');
  grid.innerHTML = '';

  // Section groupings
  const sections = [...new Set(COLS.map(c => c.section))];
  sections.forEach(sec => {
    const secCols = COLS.filter(c => c.section === sec);
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col items-start mr-3 mb-2';

    const label = document.createElement('div');
    label.className = 'section-label mb-1';
    label.textContent = sec + ' (' + secCols.length + ')';
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'flex gap-0.5';

    secCols.forEach(col => {
      const cell = document.createElement('div');
      cell.className = 'col-cell ' + SRC_CONFIG[col.src].cls;
      const dimmed = filter !== 'all' && col.src !== filter;
      if (dimmed) cell.style.opacity = '0.15';
      cell.title = `[${col.c}] ${col.name}`;
      cell.onclick = () => showDetail(col);
      if (selectedCol === col.c) cell.classList.add('selected');
      row.appendChild(cell);
    });

    wrap.appendChild(row);
    grid.appendChild(wrap);
  });
}

function renderStats() {
  const counts = {};
  COLS.forEach(c => { counts[c.src] = (counts[c.src]||0) + 1; });
  const total = COLS.length;

  Object.entries(SRC_CONFIG).forEach(([src, cfg]) => {
    const n = counts[src] || 0;
    const pct = Math.round(n / total * 100);
    const statEl = document.getElementById('stat-' + src);
    if (!statEl) return;
    statEl.innerHTML = `
      <div class="legend-dot ${cfg.cls} mx-auto mb-1" style="width:10px;height:10px;border-radius:2px"></div>
      <div class="stat-num text-white">${n}</div>
      <div class="text-xs text-slate-500">${pct}%</div>
      <div class="text-xs text-slate-600" style="font-size:9px;line-height:1.3">${cfg.label}</div>
    `;
    // 添加点击事件
    statEl.style.cursor = 'pointer';
    statEl.style.transition = 'all 0.2s';
    statEl.onclick = () => filterSource(src);
    statEl.onmouseenter = () => {
      statEl.style.transform = 'scale(1.05)';
      statEl.style.opacity = '1';
    };
    statEl.onmouseleave = () => {
      statEl.style.transform = 'scale(1)';
      statEl.style.opacity = (activeFilter === 'all' || activeFilter === src) ? '1' : '0.7';
    };
    // 初始透明度
    statEl.style.opacity = (activeFilter === 'all' || activeFilter === src) ? '1' : '0.7';
  });
}

function showDetail(col) {
  selectedCol = col.c;
  renderGrid(activeFilter);

  const cfg = SRC_CONFIG[col.src];
  document.getElementById('detail-default').classList.add('hidden');
  const content = document.getElementById('detail-content');
  content.classList.remove('hidden');
  // force re-animation
  content.classList.remove('fade-up');
  void content.offsetWidth;
  content.classList.add('fade-up');

  document.getElementById('d-colnum').textContent = '第 ' + col.c + ' 列';
  document.getElementById('d-name').textContent = col.name;
  document.getElementById('d-section').textContent = col.section;
  document.getElementById('d-dot').className = 'legend-dot ' + cfg.cls;
  document.getElementById('d-src-label').textContent = cfg.label;
  document.getElementById('d-src-label').style.color = getComputedColor(col.src);
  document.getElementById('d-how').textContent = col.how;
  document.getElementById('d-example').textContent = col.example;
  document.getElementById('d-action').innerHTML = col.action;
}

function getComputedColor(src) {
  const m = { auto:'#60a5fa', history:'#34d399', zero:'#a78bfa', voice:'#22d3ee', ai:'#fcd34d', calc:'#6b7280', human:'#f87171' };
  return m[src] || '#94a3b8';
}

function filterSource(src) {
  // Toggle: 如果点击的是当前激活的筛选，则取消筛选
  if (activeFilter === src && src !== 'all') {
    src = 'all';
  }

  activeFilter = src;
  activeSection = null; // 清除区块筛选
  renderGrid(src);
  // highlight legend
  Object.keys(SRC_CONFIG).forEach(s => {
    const el = document.getElementById('leg-' + s);
    if (!el) return;
    el.style.opacity = (src === 'all' || src === s) ? '1' : '0.3';
  });
  // highlight stats
  Object.keys(SRC_CONFIG).forEach(s => {
    const statEl = document.getElementById('stat-' + s);
    if (!statEl) return;
    statEl.style.opacity = (src === 'all' || src === s) ? '1' : '0.7';
  });
}

// 按区块筛选
let activeSection = null;

function filterBySection(section) {
  // Toggle: 如果点击的是当前激活的区块，则取消筛选
  if (activeSection === section) {
    activeSection = null;
    activeFilter = 'all';
    renderGrid('all');
    // 重置图例和统计高亮
    Object.keys(SRC_CONFIG).forEach(s => {
      const el = document.getElementById('leg-' + s);
      if (el) el.style.opacity = '1';
      const statEl = document.getElementById('stat-' + s);
      if (statEl) statEl.style.opacity = '1';
    });
    return;
  }

  activeSection = section;
  activeFilter = 'all';
  renderGridBySection(section);
  // 重置图例高亮
  Object.keys(SRC_CONFIG).forEach(s => {
    const el = document.getElementById('leg-' + s);
    if (el) el.style.opacity = '1';
    const statEl = document.getElementById('stat-' + s);
    if (statEl) statEl.style.opacity = '1';
  });
}

// 按区块+数据源双重筛选
function filterSectionAndSource(section, src) {
  // Toggle: 如果点击的是当前激活的组合，则取消筛选
  if (activeSection === section && activeFilter === src) {
    activeSection = null;
    activeFilter = 'all';
    renderGrid('all');
    // 重置所有高亮
    Object.keys(SRC_CONFIG).forEach(s => {
      const el = document.getElementById('leg-' + s);
      if (el) el.style.opacity = '1';
      const statEl = document.getElementById('stat-' + s);
      if (statEl) statEl.style.opacity = '1';
    });
    return;
  }

  activeSection = section;
  activeFilter = src;
  renderGridBySectionAndSource(section, src);
  // 高亮对应图例
  Object.keys(SRC_CONFIG).forEach(s => {
    const el = document.getElementById('leg-' + s);
    if (!el) return;
    el.style.opacity = (s === src) ? '1' : '0.3';
    const statEl = document.getElementById('stat-' + s);
    if (!statEl) return;
    statEl.style.opacity = (s === src) ? '1' : '0.7';
  });
}

// 按区块渲染
function renderGridBySection(section) {
  const grid = document.getElementById('col-grid');
  grid.innerHTML = '';

  const sections = [...new Set(COLS.map(c => c.section))];
  sections.forEach(sec => {
    const secCols = COLS.filter(c => c.section === sec);
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col items-start mr-3 mb-2';

    const label = document.createElement('div');
    label.className = 'section-label mb-1';
    label.textContent = sec + ' (' + secCols.length + ')';
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'flex gap-0.5';

    secCols.forEach(col => {
      const cell = document.createElement('div');
      cell.className = 'col-cell ' + SRC_CONFIG[col.src].cls;
      const dimmed = sec !== section;
      if (dimmed) cell.style.opacity = '0.15';
      cell.title = `[${col.c}] ${col.name}`;
      cell.onclick = () => showDetail(col);
      if (selectedCol === col.c) cell.classList.add('selected');
      row.appendChild(cell);
    });

    wrap.appendChild(row);
    grid.appendChild(wrap);
  });
}

// 按区块+数据源渲染
function renderGridBySectionAndSource(section, src) {
  const grid = document.getElementById('col-grid');
  grid.innerHTML = '';

  const sections = [...new Set(COLS.map(c => c.section))];
  sections.forEach(sec => {
    const secCols = COLS.filter(c => c.section === sec);
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col items-start mr-3 mb-2';

    const label = document.createElement('div');
    label.className = 'section-label mb-1';
    label.textContent = sec + ' (' + secCols.length + ')';
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'flex gap-0.5';

    secCols.forEach(col => {
      const cell = document.createElement('div');
      cell.className = 'col-cell ' + SRC_CONFIG[col.src].cls;
      const dimmed = (sec !== section) || (col.src !== src);
      if (dimmed) cell.style.opacity = '0.15';
      cell.title = `[${col.c}] ${col.name}`;
      cell.onclick = () => showDetail(col);
      if (selectedCol === col.c) cell.classList.add('selected');
      row.appendChild(cell);
    });

    wrap.appendChild(row);
    grid.appendChild(wrap);
  });
}

// ══════════════════════════════════════
// 区块汇总
// ══════════════════════════════════════
function renderSectionSummary() {
  const sections = [...new Set(COLS.map(c => c.section))];
  const srcOrder = ['auto','history','zero','voice','ai','calc','human'];

  document.getElementById('section-summary').innerHTML = sections.map(sec => {
    const secCols = COLS.filter(c => c.section === sec);
    const srcBreak = {};
    secCols.forEach(c => { srcBreak[c.src] = (srcBreak[c.src]||0) + 1; });

    const chips = srcOrder.filter(s => srcBreak[s]).map(s => {
      const cfg = SRC_CONFIG[s];
      const chipId = `chip-${sec.replace(/\s+/g, '-')}-${s}`;
      return `<span id="${chipId}" class="text-xs px-2 py-0.5 rounded-full mr-1 font-semibold cursor-pointer hover:opacity-80 transition-opacity"
                     style="background:rgba(255,255,255,.05);color:${getComputedColor(s)}"
                     onclick="toggleFieldList('${sec}', '${s}')"
                     title="点击查看${sec}中的${cfg.label}">${cfg.label} ${srcBreak[s]}列</span>`;
    }).join('');

    return `
      <div class="mb-3">
        <div class="flex items-center gap-3 py-2 border-b border-slate-900/80">
          <div class="w-24 text-xs text-slate-500 flex-shrink-0 cursor-pointer hover:text-slate-300 transition-colors"
               onclick="filterBySection('${sec}')"
               title="点击查看${sec}的所有列">${sec}</div>
          <div class="text-xs text-slate-700 w-6 flex-shrink-0">${secCols.length}列</div>
          <div class="flex flex-wrap gap-1">${chips}</div>
        </div>
        <div id="fields-${sec.replace(/\s+/g, '-')}" class="hidden"></div>
      </div>
    `;
  }).join('');
}

// 切换字段列表显示
let activeFieldList = null;

function toggleFieldList(section, src) {
  const fieldListId = `fields-${section.replace(/\s+/g, '-')}`;
  const fieldListEl = document.getElementById(fieldListId);

  // 如果点击的是当前显示的列表，则关闭
  if (activeFieldList === fieldListId) {
    fieldListEl.classList.add('hidden');
    fieldListEl.innerHTML = '';
    activeFieldList = null;
    // 同时取消筛选
    filterSectionAndSource(section, src);
    return;
  }

  // 关闭之前打开的列表
  if (activeFieldList) {
    const prevEl = document.getElementById(activeFieldList);
    if (prevEl) {
      prevEl.classList.add('hidden');
      prevEl.innerHTML = '';
    }
  }

  // 获取该区块+数据源的所有字段
  const fields = COLS.filter(c => c.section === section && c.src === src);

  // 生成字段列表
  const fieldListHTML = `
    <div class="field-list-panel">
      <div class="text-xs text-slate-500 mb-2 font-semibold">
        ${section} · ${SRC_CONFIG[src].label} (${fields.length}列)
      </div>
      ${fields.map(col => `
        <div class="field-item" onclick="showDetail(COLS[${col.c}])" title="点击查看详情">
          <span class="field-item-num">[${col.c}]</span>
          <span class="field-item-name">${col.name}</span>
        </div>
      `).join('')}
    </div>
  `;

  fieldListEl.innerHTML = fieldListHTML;
  fieldListEl.classList.remove('hidden');
  activeFieldList = fieldListId;

  // 同时应用筛选
  filterSectionAndSource(section, src);
}

// ══════════════════════════════════════
// Init
// ══════════════════════════════════════
window.onload = () => {
  renderStats();
  renderGrid('all');
  renderSectionSummary();
};
